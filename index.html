<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family: Arial, sans-serif;
}

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #181818 0%, #050505 75%);
  color: white;
}

#loadingScreen h1 {
  font-size: clamp(48px, 10vw, 80px);
  margin: 0;
  letter-spacing: 8px;
}

#loadingScreen p {
  opacity: .75;
  font-size: 18px;
  margin: 20px 0 35px;
  letter-spacing: 2px;
}

#teamButtons {
  display: flex;
  gap: 25px;
}

.teamButton {
  width: 220px;
  height: 150px;
  border: 3px solid white;
  background: #111;
  color: white;
  font-size: 28px;
  font-weight: bold;
  border-radius: 15px;
  cursor: pointer;
}

#homeButton {
  border-color: #e53935;
}

#awayButton {
  border-color: #2196f3;
}

.teamButton:active {
  transform: scale(.96);
}
</style>
</head>

<body>

<div id="loadingScreen">
  <h1>FALSE 9</h1>
  <p>CHOOSE YOUR TEAM</p>

  <div id="teamButtons">
    <button class="teamButton" id="homeButton">HOME</button>
    <button class="teamButton" id="awayButton">AWAY</button>
  </div>
</div>


<a-scene
  id="scene"
  vr-mode-ui="enabled: true"
  loading-screen="enabled: false"
  renderer="antialias: true; colorManagement: true"
  background="color: #9bc8ea">

  <!-- LIGHTING -->

  <a-entity
    light="type: directional; intensity: 2"
    position="-30 50 20">
  </a-entity>

  <a-entity
    light="type: ambient; intensity: 1.1">
  </a-entity>


  <!-- CAMERA / PLAYER -->

  <a-entity id="rig" position="0 1.6 25">

    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled: true"
      wasd-controls="enabled: true">

    </a-camera>


    <!-- LEFT VR CONTROLLER -->

    <a-entity
      id="leftController"
      laser-controls="hand: left">

      <a-entity
        id="leftFoot"
        position="-0.18 -1.1 -0.45">

        <a-box
          width="0.32"
          height="0.18"
          depth="0.65"
          color="#df1717">
        </a-box>

        <a-sphere
          radius="0.16"
          scale="1 .65 1.4"
          position="0 0 -0.27"
          color="#ef2020">
        </a-sphere>

        <a-box
          width="0.34"
          height="0.07"
          depth="0.68"
          position="0 -0.12 0"
          color="#111">
        </a-box>

        <a-box
          width="0.20"
          height="0.025"
          depth="0.04"
          position="0 0.10 -0.10"
          color="#ffffff">
        </a-box>

        <a-box
          width="0.20"
          height="0.025"
          depth="0.04"
          position="0 0.10 0.03"
          color="#ffffff">
        </a-box>

      </a-entity>

    </a-entity>


    <!-- RIGHT VR CONTROLLER -->

    <a-entity
      id="rightController"
      laser-controls="hand: right">

      <a-entity
        id="rightFoot"
        position="0.18 -1.1 -0.45">

        <a-box
          width="0.32"
          height="0.18"
          depth="0.65"
          color="#df1717">
        </a-box>

        <a-sphere
          radius="0.16"
          scale="1 .65 1.4"
          position="0 0 -0.27"
          color="#ef2020">
        </a-sphere>

        <a-box
          width="0.34"
          height="0.07"
          depth="0.68"
          position="0 -0.12 0"
          color="#111">
        </a-box>

        <a-box
          width="0.20"
          height="0.025"
          depth="0.04"
          position="0 0.10 -0.10"
          color="#ffffff">
        </a-box>

        <a-box
          width="0.20"
          height="0.025"
          depth="0.04"
          position="0 0.10 0.03"
          color="#ffffff">
        </a-box>

      </a-entity>

    </a-entity>

  </a-entity>


  <!-- FIELD -->

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="68"
    position="0 0 0"
    color="#2f7d32">
  </a-plane>


  <!-- GRASS STRIPES -->

  <a-plane rotation="-90 0 0" width="108" height="8" position="0 0.005 -25" color="#347f35"></a-plane>
  <a-plane rotation="-90 0 0" width="108" height="8" position="0 0.005 -9" color="#347f35"></a-plane>
  <a-plane rotation="-90 0 0" width="108" height="8" position="0 0.005 9" color="#347f35"></a-plane>
  <a-plane rotation="-90 0 0" width="108" height="8" position="0 0.005 25" color="#347f35"></a-plane>


  <!-- FIELD LINES -->

  <a-entity id="fieldLines"></a-entity>


  <!-- BALL -->

  <a-sphere
    id="ball"
    position="0 0.42 0"
    radius="0.42"
    color="#ffffff"
    ball-physics>
  </a-sphere>


  <!-- GOALS -->

  <a-entity id="northGoal" position="0 0 -34" goal></a-entity>

  <a-entity
    id="southGoal"
    position="0 0 34"
    rotation="0 180 0"
    goal>
  </a-entity>


  <!-- STADIUM -->

  <a-entity id="stadium"></a-entity>


  <!-- NORTH SCOREBOARD -->

  <a-entity position="0 18 -47">

    <a-box
      width="18"
      height="7"
      depth=".6"
      color="#111">
    </a-box>

    <a-text
      id="northScore"
      value="HOME  0  -  0  AWAY"
      align="center"
      width="16"
      color="#ffffff"
      position="0 0 .32">
    </a-text>

  </a-entity>


  <!-- SOUTH SCOREBOARD -->

  <a-entity
    position="0 18 47"
    rotation="0 180 0">

    <a-box
      width="18"
      height="7"
      depth=".6"
      color="#111">
    </a-box>

    <a-text
      id="southScore"
      value="HOME  0  -  0  AWAY"
      align="center"
      width="16"
      color="#ffffff"
      position="0 0 .32">
    </a-text>

  </a-entity>


  <a-sky color="#9cccf0"></a-sky>

</a-scene>


<script>

/* =========================
   TEAM SELECTION
========================= */

const loadingScreen =
  document.getElementById("loadingScreen");

const rig =
  document.getElementById("rig");

document
  .getElementById("homeButton")
  .addEventListener("click", function () {

    loadingScreen.style.display = "none";

    rig.setAttribute(
      "position",
      "-10 1.6 22"
    );

  });

document
  .getElementById("awayButton")
  .addEventListener("click", function () {

    loadingScreen.style.display = "none";

    rig.setAttribute(
      "position",
      "10 1.6 -22"
    );

  });


/* =========================
   SCORE
========================= */

let homeScore = 0;
let awayScore = 0;

function updateScore() {

  const text =
    "HOME  " +
    homeScore +
    "  -  " +
    awayScore +
    "  AWAY";

  document
    .getElementById("northScore")
    .setAttribute("value", text);

  document
    .getElementById("southScore")
    .setAttribute("value", text);

}


function resetBall() {

  const ball =
    document.getElementById("ball");

  ball.object3D.position.set(
    0,
    0.42,
    0
  );

  const physics =
    ball.components["ball-physics"];

  if (physics) {

    physics.velocity.set(
      0,
      0,
      0
    );

  }

}


function scoreGoal(team) {

  if (team === "home") {

    homeScore++;

  } else {

    awayScore++;

  }

  updateScore();

  setTimeout(
    resetBall,
    1000
  );

}


/* =========================
   FIELD LINES
========================= */

window.addEventListener(
  "load",
  function () {

    const lines =
      document.getElementById(
        "fieldLines"
      );

    function addLine(
      width,
      depth,
      x,
      z
    ) {

      const line =
        document.createElement(
          "a-box"
        );

      line.setAttribute(
        "width",
        width
      );

      line.setAttribute(
        "height",
        ".025"
      );

      line.setAttribute(
        "depth",
        depth
      );

      line.setAttribute(
        "color",
        "#ffffff"
      );

      line.setAttribute(
        "position",
        x + " .02 " + z
      );

      lines.appendChild(line);

    }


    /* OUTER LINES */

    addLine(108, .12, 0, -34);
    addLine(108, .12, 0, 34);

    addLine(.12, 68, -54, 0);
    addLine(.12, 68, 54, 0);


    /* HALF WAY */

    addLine(108, .10, 0, 0);


    /* CENTER CIRCLE */

    const circle =
      document.createElement(
        "a-ring"
      );

    circle.setAttribute(
      "rotation",
      "-90 0 0"
    );

    circle.setAttribute(
      "radius-inner",
      "9.05"
    );

    circle.setAttribute(
      "radius-outer",
      "9.13"
    );

    circle.setAttribute(
      "color",
      "#ffffff"
    );

    circle.setAttribute(
      "position",
      "0 .02 0"
    );

    lines.appendChild(circle);


    function spot(
      x,
      z
    ) {

      const s =
        document.createElement(
          "a-cylinder"
        );

      s.setAttribute(
        "radius",
        ".13"
      );

      s.setAttribute(
        "height",
        ".025"
      );

      s.setAttribute(
        "color",
        "#ffffff"
      );

      s.setAttribute(
        "position",
        x + " .02 " + z
      );

      lines.appendChild(s);

    }


    spot(0, 0);


    function boxLines(
      goalZ,
      depth,
      width
    ) {

      const direction =
        goalZ < 0 ? 1 : -1;

      const front =
        goalZ +
        direction * depth;

      addLine(
        width,
        .10,
        0,
        front
      );

      addLine(
        .10,
        depth,
        -width / 2,
        (goalZ + front) / 2
      );

      addLine(
        .10,
        depth,
        width / 2,
        (goalZ + front) / 2
      );

    }


    /* PENALTY AREAS */

    boxLines(
      -34,
      16.5,
      40.3
    );

    boxLines(
      34,
      16.5,
      40.3
    );


    /* SIX YARD BOXES */

    boxLines(
      -34,
      5.5,
      18.3
    );

    boxLines(
      34,
      5.5,
      18.3
    );


    /* PENALTY SPOTS */

    spot(0, -23);
    spot(0, 23);

  }
);


/* =========================
   GOALS
========================= */

AFRAME.registerComponent(
  "goal",
  {

    init: function () {

      const width = 7.2;
      const height = 2.3;
      const depth = 2.2;

      const goal =
        this.el;

      function bar(
        x,
        y,
        z,
        w,
        h,
        d,
        color
      ) {

        const piece =
          document.createElement(
            "a-box"
          );

        piece.setAttribute(
          "position",
          x + " " + y + " " + z
        );

        piece.setAttribute(
          "width",
          w
        );

        piece.setAttribute(
          "height",
          h
        );

        piece.setAttribute(
          "depth",
          d
        );

        piece.setAttribute(
          "color",
          color || "#ffffff"
        );

        goal.appendChild(piece);

      }


      /* POSTS */

      bar(
        -width / 2,
        height / 2,
        0,
        .18,
        height,
        .18
      );

      bar(
        width / 2,
        height / 2,
        0,
        .18,
        height,
        .18
      );


      /* CROSSBAR */

      bar(
        0,
        height,
        0,
        width,
        .18,
        .18
      );


      /* BACK FRAME */

      bar(
        0,
        height,
        depth,
        width,
        .18,
        .18
      );

      bar(
        -width / 2,
        height / 2,
        depth,
        .18,
        height,
        .18
      );

      bar(
        width / 2,
        height / 2,
        depth,
        .18,
        height,
        .18
      );


      /* SIDE CONNECTORS */

      bar(
        -width / 2,
        height,
        depth / 2,
        .18,
        .18,
        depth
      );

      bar(
        width / 2,
        height,
        depth / 2,
        .18,
        .18,
        depth
      );


      /* NET */

      for (
        let x = -width / 2;
        x <= width / 2;
        x += .6
      ) {

        bar(
          x,
          height / 2,
          depth,
          .025,
          height,
          .025,
          "#dddddd"
        );

      }


      for (
        let y = .2;
        y <= height;
        y += .35
      ) {

        bar(
          0,
          y,
          depth,
          width,
          .025,
          .025,
          "#dddddd"
        );

      }

    }

  }
);


/* =========================
   STADIUM
========================= */

AFRAME.registerComponent(
  "stadium-maker",
  {

    init: function () {

      const stadium =
        this.el;

      function block(
        x,
        y,
        z,
        width,
        height,
        depth,
        color
      ) {

        const b =
          document.createElement(
            "a-box"
          );

        b.setAttribute(
          "position",
          x + " " + y + " " + z
        );

        b.setAttribute(
          "width",
          width
        );

        b.setAttribute(
          "height",
          height
        );

        b.setAttribute(
          "depth",
          depth
        );

        b.setAttribute(
          "color",
          color
        );

        stadium.appendChild(b);

      }


      /* CONTINUOUS STANDS */

      for (
        let tier = 0;
        tier < 9;
        tier++
      ) {

        const y =
          1 +
          tier * 1.2;

        const offset =
          tier * 1.7;

        block(
          0,
          y,
          -38 - offset,
          125 + tier * 4,
          1.15,
          4.8,
          tier % 2
            ? "#4d2584"
            : "#6838aa"
        );

        block(
          0,
          y,
          38 + offset,
          125 + tier * 4,
          1.15,
          4.8,
          tier % 2
            ? "#4d2584"
            : "#6838aa"
        );

        block(
          -58 - offset,
          y,
          0,
          4.8,
          1.15,
          82 + tier * 4,
          tier % 2
            ? "#4d2584"
            : "#6838aa"
        );

        block(
          58 + offset,
          y,
          0,
          4.8,
          1.15,
          82 + tier * 4,
          tier % 2
            ? "#4d2584"
            : "#6838aa"
        );

      }


      /* ROOF */

      const roofY = 27;

      block(
        0,
        roofY,
        -63,
        155,
        2,
        20,
        "#171717"
      );

      block(
        0,
        roofY,
        63,
        155,
        2,
        20,
        "#171717"
      );

      block(
        -73,
        roofY,
        0,
        20,
        2,
        110,
        "#171717"
      );

      block(
        73,
        roofY,
        0,
        20,
        2,
        110,
        "#171717"
      );


      /* LIGHT STRIPS */

      block(
        0,
        25.5,
        -52,
        130,
        .5,
        1,
        "#eeeeff"
      );

      block(
        0,
        25.5,
        52,
        130,
        .5,
        1,
        "#eeeeff"
      );

    }

  }
);


/* ADD STADIUM COMPONENT */

document
  .getElementById("stadium")
  .setAttribute(
    "stadium-maker",
    ""
  );


/* =========================
   BALL PHYSICS
========================= */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function () {

      this.velocity =
        new THREE.Vector3();

      this.radius = .42;

      this.lastKick = 0;

    },


    tick: function (
      time,
      delta
    ) {

      const ball =
        this.el.object3D;

      const dt =
        Math.min(
          delta / 1000,
          .03
        );


      /* GRAVITY */

      this.velocity.y -=
        9.8 * dt;


      /* MOVE */

      ball.position.addScaledVector(
        this.velocity,
        dt
      );


      /* GROUND */

      if (
        ball.position.y <
        this.radius
      ) {

        ball.position.y =
          this.radius;

        if (
          this.velocity.y < 0
        ) {

          this.velocity.y *=
            -.25;

        }

        /* SLOW BALL */

        this.velocity.x *= .985;
        this.velocity.z *= .985;

      }


      /* AIR DRAG */

      this.velocity.multiplyScalar(
        .997
      );


      /* FIELD SIDES */

      if (
        ball.position.x < -53.5
      ) {

        ball.position.x =
          -53.5;

        this.velocity.x *=
          -.6;

      }

      if (
        ball.position.x > 53.5
      ) {

        ball.position.x =
          53.5;

        this.velocity.x *=
          -.6;

      }


      /* GOALS */

      const halfGoal =
        3.6;

      const goalHeight =
        2.3;


      if (
        ball.position.z < -34
      ) {

        if (
          Math.abs(ball.position.x) <
          halfGoal - .2
          &&
          ball.position.y <
          goalHeight
        ) {

          if (
            ball.position.z <
            -35.5
          ) {

            scoreGoal(
              "away"
            );

          }

        } else {

          ball.position.z =
            -33.5;

          this.velocity.z *=
            -.65;

        }

      }


      if (
        ball.position.z > 34
      ) {

        if (
          Math.abs(ball.position.x) <
          halfGoal - .2
          &&
          ball.position.y <
          goalHeight
        ) {

          if (
            ball.position.z >
            35.5
          ) {

            scoreGoal(
              "home"
            );

          }

        } else {

          ball.position.z =
            33.5;

          this.velocity.z *=
            -.65;

        }

      }


      /* BACK OF NET */

      if (
        ball.position.z < -36.1
      ) {

        ball.position.z =
          -36.1;

        this.velocity.z *=
          -.4;

      }

      if (
        ball.position.z > 36.1
      ) {

        ball.position.z =
          36.1;

        this.velocity.z *=
          -.4;

      }


      /* BALL ROTATION */

      ball.rotation.z +=
        this.velocity.x *
        dt *
        1.5;

      ball.rotation.x -=
        this.velocity.z *
        dt *
        1.5;

    }

  }
);

</script>

</body>
</html>
