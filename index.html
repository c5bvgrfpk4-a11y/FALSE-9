<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9 - Arena Editor</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050508;
  font-family: Arial, sans-serif;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(circle at center,
      #24154a 0%,
      #090b18 55%,
      #000 100%);

  color: white;
}

#startScreen h1 {
  font-size: clamp(50px, 10vw, 100px);
  letter-spacing: 12px;
  margin: 0;
  text-shadow:
    0 0 20px #8b5cff,
    0 0 70px #5826aa;
}

#startScreen p {
  opacity: .75;
  letter-spacing: 4px;
}

.startButtons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.startButton {
  width: 200px;
  height: 70px;

  border: 2px solid #7c55ff;
  border-radius: 12px;

  background: #121222;
  color: white;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;
}

.startButton:hover {
  background: #242044;
}

/* =========================
   DESKTOP EDITOR
========================= */

#editorPanel {
  position: fixed;

  top: 15px;
  left: 15px;

  width: 260px;

  z-index: 9000;

  background: rgba(10,10,20,.93);

  border: 1px solid #6848d6;
  border-radius: 12px;

  padding: 15px;

  color: white;

  display: none;

  max-height: calc(100vh - 30px);
  overflow-y: auto;
}

#editorPanel h2 {
  margin-top: 0;
  color: #bbaaff;
}

.editorSection {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #333;
}

.editorSection:first-of-type {
  border-top: none;
}

.editorPanelButton {
  width: 100%;
  margin: 4px 0;
  padding: 10px;

  border: 1px solid #5f48b8;
  border-radius: 7px;

  background: #1a1930;
  color: white;

  cursor: pointer;
}

.editorPanelButton:hover {
  background: #302956;
}

.editorDanger {
  border-color: #aa3030;
  background: #351616;
}

.editorValue {
  width: 100%;
  box-sizing: border-box;

  margin-top: 5px;
  padding: 8px;

  background: #111;
  color: white;

  border: 1px solid #444;
  border-radius: 6px;
}

#selectedText {
  font-size: 13px;
  color: #bdb7d9;
  word-break: break-word;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair {
  position: fixed;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 14px;
  height: 14px;

  border: 2px solid white;
  border-radius: 50%;

  pointer-events: none;

  z-index: 8000;
}

#crosshair:after {
  content: "";
  position: absolute;

  left: 5px;
  top: -6px;

  width: 2px;
  height: 22px;

  background: rgba(255,255,255,.6);
}

#crosshair:before {
  content: "";
  position: absolute;

  left: -6px;
  top: 5px;

  width: 22px;
  height: 2px;

  background: rgba(255,255,255,.6);
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

  <h1>FALSE 9</h1>

  <p>PLAY OR BUILD YOUR ARENA</p>

  <div class="startButtons">

    <button class="startButton" id="playButton">
      PLAY HOME
    </button>

    <button class="startButton" id="awayButton">
      PLAY AWAY
    </button>

    <button class="startButton" id="editorButton">
      ARENA EDITOR
    </button>

  </div>

</div>


<!-- =========================
     DESKTOP EDITOR PANEL
========================= -->

<div id="editorPanel">

  <h2>🏗 ARENA EDITOR</h2>

  <div id="selectedText">
    No object selected
  </div>


  <div class="editorSection">

    <strong>ADD OBJECTS</strong>

    <button class="editorPanelButton" id="addBox">
      Add Block
    </button>

    <button class="editorPanelButton" id="addSeat">
      Add Seat Row
    </button>

    <button class="editorPanelButton" id="addLight">
      Add Stadium Light
    </button>

    <button class="editorPanelButton" id="addSphere">
      Add Decoration
    </button>

  </div>


  <div class="editorSection">

    <strong>MOVE SELECTED</strong>

    <button class="editorPanelButton" id="moveLeft">
      ← Left
    </button>

    <button class="editorPanelButton" id="moveRight">
      Right →
    </button>

    <button class="editorPanelButton" id="moveForward">
      Forward
    </button>

    <button class="editorPanelButton" id="moveBack">
      Back
    </button>

    <button class="editorPanelButton" id="moveUp">
      ↑ Up
    </button>

    <button class="editorPanelButton" id="moveDown">
      ↓ Down
    </button>

  </div>


  <div class="editorSection">

    <strong>ROTATE</strong>

    <button class="editorPanelButton" id="rotateLeft">
      Rotate Left
    </button>

    <button class="editorPanelButton" id="rotateRight">
      Rotate Right
    </button>

  </div>


  <div class="editorSection">

    <strong>SCALE</strong>

    <button class="editorPanelButton" id="scaleUp">
      Bigger
    </button>

    <button class="editorPanelButton" id="scaleDown">
      Smaller
    </button>

  </div>


  <div class="editorSection">

    <strong>COLOR</strong>

    <input
      type="color"
      id="colorPicker"
      class="editorValue"
      value="#6633aa"
    >

    <button
      class="editorPanelButton"
      id="applyColor">

      Apply Color

    </button>

  </div>


  <div class="editorSection">

    <button
      class="editorPanelButton editorDanger"
      id="deleteObject">

      Delete Selected

    </button>

    <button
      class="editorPanelButton"
      id="saveArena">

      💾 Save Arena

    </button>

    <button
      class="editorPanelButton"
      id="loadArena">

      📂 Load Arena

    </button>

    <button
      class="editorPanelButton editorDanger"
      id="resetArena">

      Reset Custom Objects

    </button>

    <button
      class="editorPanelButton"
      id="closeEditor">

      Exit Editor

    </button>

  </div>

</div>


<div id="crosshair"></div>


<!-- =========================
     A-FRAME SCENE
========================= -->

<a-scene

  id="scene"

  vr-mode-ui="enabled: true"

  loading-screen="enabled: false"

  renderer="
    antialias: true;
    colorManagement: true;
  "

  background="color: #030612">


  <!-- SKY -->

  <a-sky
    id="sky"
    color="#030612">
  </a-sky>


  <!-- LIGHTING -->

  <a-entity
    id="ambientLight"
    light="
      type: ambient;
      intensity: 0.35;
      color: #aab8ff">
  </a-entity>


  <a-entity
    id="sunLight"
    position="-30 45 20"
    light="
      type: directional;
      intensity: 0.8;
      color: #b9cfff">
  </a-entity>


  <!-- =========================
       PLAYER RIG
  ========================= -->

  <a-entity
    id="rig"
    position="0 1.65 25">


    <a-camera
      id="camera"
      look-controls
      wasd-controls
      cursor="
        rayOrigin: mouse;
        fuse: false">
    </a-camera>



    <!-- =====================
         LEFT CONTROLLER
    ====================== -->

    <a-entity
      id="leftController"
      laser-controls="hand: left"
      raycaster="
        objects: .clickable;
        far: 30">

      <!-- LEFT BOOT -->

      <a-entity
        position="-0.18 -1.05 -0.45"
        boot-model>

      </a-entity>


      <!-- THREE LINE BUTTON
           ATTACHED TO LEFT HAND
      -->

      <a-entity
        id="leftMenuButton"
        class="clickable"
        position="0 0.10 -0.18"
        menu-button>

        <a-box
          width=".32"
          height=".045"
          depth=".05"
          position="0 .10 0"
          color="#ffffff">
        </a-box>

        <a-box
          width=".32"
          height=".045"
          depth=".05"
          position="0 0 0"
          color="#ffffff">
        </a-box>

        <a-box
          width=".32"
          height=".045"
          depth=".05"
          position="0 -.10 0"
          color="#ffffff">
        </a-box>

      </a-entity>


      <!-- VR MENU ATTACHED TO LEFT CONTROLLER -->

      <a-entity
        id="vrMenu"
        position="0.8 0.35 -1.1"
        visible="false">


        <a-box
          width="3.5"
          height="4.5"
          depth=".08"
          color="#111122"
          opacity=".96">
        </a-box>


        <a-text
          value="FALSE 9"
          align="center"
          width="3.2"
          color="#ffffff"
          position="0 1.85 .06">
        </a-text>


        <a-text
          id="vrLobbyCode"
          value="LOBBY: A-123456"
          align="center"
          width="3"
          color="#bca9ff"
          position="0 1.35 .06">
        </a-text>


        <a-box
          id="vrDayButton"
          class="clickable"
          width="2.4"
          height=".42"
          depth=".12"
          position="0 .70 .10"
          color="#356fba">
        </a-box>

        <a-text
          value="DAY"
          align="center"
          width="2"
          position="0 .70 .18"
          color="white">
        </a-text>


        <a-box
          id="vrNightButton"
          class="clickable"
          width="2.4"
          height=".42"
          depth=".12"
          position="0 .15 .10"
          color="#222b55">
        </a-box>

        <a-text
          value="NIGHT"
          align="center"
          width="2"
          position="0 .15 .18"
          color="white">
        </a-text>


        <a-box
          id="vrNormalButton"
          class="clickable"
          width="2.4"
          height=".42"
          depth=".12"
          position="0 -.50 .10"
          color="#555555">
        </a-box>

        <a-text
          value="NORMAL WEATHER"
          align="center"
          width="2.2"
          position="0 -.50 .18"
          color="white">
        </a-text>


        <a-box
          id="vrRainButton"
          class="clickable"
          width="2.4"
          height=".42"
          depth=".12"
          position="0 -1.05 .10"
          color="#285fa5">
        </a-box>

        <a-text
          value="RAIN"
          align="center"
          width="2"
          position="0 -1.05 .18"
          color="white">
        </a-text>


        <a-box
          id="vrSnowButton"
          class="clickable"
          width="2.4"
          height=".42"
          depth=".12"
          position="0 -1.60 .10"
          color="#999999">
        </a-box>

        <a-text
          value="SNOW"
          align="center"
          width="2"
          position="0 -1.60 .18"
          color="white">
        </a-text>

      </a-entity>

    </a-entity>



    <!-- =====================
         RIGHT CONTROLLER
    ====================== -->

    <a-entity
      id="rightController"
      laser-controls="hand: right"
      raycaster="
        objects: .clickable;
        far: 30">

      <!-- RIGHT BOOT -->

      <a-entity
        position="0.18 -1.05 -0.45"
        boot-model>

      </a-entity>

    </a-entity>


  </a-entity>


  <!-- =========================
       FIELD
  ========================= -->

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="68"
    color="#236b30">
  </a-plane>


  <!-- GRASS STRIPES -->

  <a-plane rotation="-90 0 0" width="108" height="8"
    position="0 .004 -28" color="#2c7835"></a-plane>

  <a-plane rotation="-90 0 0" width="108" height="8"
    position="0 .004 -12" color="#236b30"></a-plane>

  <a-plane rotation="-90 0 0" width="108" height="8"
    position="0 .004 4" color="#2c7835"></a-plane>

  <a-plane rotation="-90 0 0" width="108" height="8"
    position="0 .004 20" color="#236b30"></a-plane>


  <!-- FIELD LINES -->

  <a-entity id="fieldLines"></a-entity>


  <!-- =========================
       SOCCER BALL
  ========================= -->

  <a-entity
    id="ball"
    position="0 .32 0"
    ball-physics>


    <!-- MAIN WHITE BALL -->

    <a-sphere
      radius=".32"
      color="#f7f7f7"
      segments-width="32"
      segments-height="24">
    </a-sphere>


    <!-- BLACK PANELS -->

    <a-sphere
      radius=".326"
      scale=".42 .42 .10"
      position="0 .13 -.28"
      color="#111111">
    </a-sphere>

    <a-sphere
      radius=".326"
      scale=".42 .42 .10"
      position="0 -.13 .28"
      rotation="0 180 0"
      color="#111111">
    </a-sphere>

    <a-sphere
      radius=".326"
      scale=".10 .42 .42"
      position=".28 0 0"
      color="#111111">
    </a-sphere>

    <a-sphere
      radius=".326"
      scale=".10 .42 .42"
      position="-.28 0 0"
      color="#111111">
    </a-sphere>

    <a-sphere
      radius=".326"
      scale=".30 .10 .30"
      position="0 .30 0"
      color="#111111">
    </a-sphere>


  </a-entity>


  <!-- GOALS -->

  <a-entity
    position="0 0 -34"
    goal>
  </a-entity>

  <a-entity
    position="0 0 34"
    rotation="0 180 0"
    goal>
  </a-entity>


  <!-- STADIUM -->

  <a-entity
    id="stadium"
    stadium-maker>
  </a-entity>


  <!-- CUSTOM EDITOR OBJECTS -->

  <a-entity id="customObjects"></a-entity>


  <!-- WEATHER -->

  <a-entity id="weather"></a-entity>


</a-scene>


<script>

/* ========================================
   GLOBAL STATE
======================================== */

let editorMode = false;
let selectedObject = null;
let homeTeam = true;

const scene = document.getElementById("scene");
const rig = document.getElementById("rig");
const customObjects =
  document.getElementById("customObjects");


/* ========================================
   LOBBY CODE
======================================== */

function generateLobbyCode() {

  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const letter =
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ];

  const number =
    Math.floor(
      100000 +
      Math.random() *
      900000
    );

  return letter + "-" + number;

}

const lobbyCode =
  generateLobbyCode();


/* ========================================
   START BUTTONS
======================================== */

function startGame(team, editor) {

  homeTeam = team;

  editorMode = editor;

  document
    .getElementById("startScreen")
    .style.display =
      "none";

  document
    .getElementById("editorPanel")
    .style.display =
      editor
        ? "block"
        : "none";


  if (editor) {

    rig.setAttribute(
      "position",
      "0 18 30"
    );

  }

  else if (team) {

    rig.setAttribute(
      "position",
      "-10 1.65 22"
    );

  }

  else {

    rig.setAttribute(
      "position",
      "10 1.65 -22"
    );

  }

}


document
  .getElementById("playButton")
  .addEventListener(
    "click",
    () => startGame(true, false)
  );


document
  .getElementById("awayButton")
  .addEventListener(
    "click",
    () => startGame(false, false)
  );


document
  .getElementById("editorButton")
  .addEventListener(
    "click",
    () => startGame(true, true)
  );


/* ========================================
   BOOT MODEL
======================================== */

AFRAME.registerComponent(
  "boot-model",
  {

    init: function () {

      const boot = this.el;

      function add(
        primitive,
        attributes
      ) {

        const el =
          document.createElement(
            primitive
          );

        Object.keys(
          attributes
        ).forEach(
          key => {

            el.setAttribute(
              key,
              attributes[key]
            );

          }
        );

        boot.appendChild(el);

      }


      /* MAIN FOOT */

      add(
        "a-box",
        {
          width: ".34",
          height: ".22",
          depth: ".62",
          position: "0 0 0",
          color: "#d61515"
        }
      );


      /* CURVED TOE */

      add(
        "a-sphere",
        {
          radius: ".18",
          scale: "1 .62 1.65",
          position: "0 -.015 -.30",
          color: "#ef2020"
        }
      );


      /* ANKLE */

      add(
        "a-box",
        {
          width: ".28",
          height: ".34",
          depth: ".24",
          position: "0 .16 .22",
          color: "#bd1111"
        }
      );


      /* BLACK SOLE */

      add(
        "a-box",
        {
          width: ".38",
          height: ".07",
          depth: ".75",
          position: "0 -.16 -.02",
          color: "#080808"
        }
      );


      /* LACES */

      const laceZ =
        [-.16, -.07, .02, .11];

      laceZ.forEach(
        z => {

          add(
            "a-box",
            {
              width: ".23",
              height: ".025",
              depth: ".035",
              position:
                "0 .12 " + z,
              color: "#ffffff"
            }
          );

        }
      );


      /* STUDS */

      [
        "-.11 -.22 -.25",
        ".11 -.22 -.25",
        "-.11 -.22 .18",
        ".11 -.22 .18"
      ].forEach(
        p => {

          add(
            "a-cylinder",
            {
              radius: ".035",
              height: ".08",
              position: p,
              color: "#111"
            }
          );

        }
      );

    }

  }
);


/* ========================================
   LEFT HAND MENU
======================================== */

AFRAME.registerComponent(
  "menu-button",
  {

    init: function () {

      this.el.addEventListener(
        "click",
        () => {

          const menu =
            document.getElementById(
              "vrMenu"
            );

          menu.setAttribute(
            "visible",
            !menu.getAttribute(
              "visible"
            )
          );

        }
      );

    }

  }
);


/* ========================================
   VR BUTTON SUPPORT
======================================== */

scene.addEventListener(
  "loaded",
  function () {

    document
      .getElementById("vrLobbyCode")
      .setAttribute(
        "value",
        "LOBBY: " +
        lobbyCode
      );


    document
      .getElementById("vrDayButton")
      .addEventListener(
        "click",
        setDay
      );


    document
      .getElementById("vrNightButton")
      .addEventListener(
        "click",
        setNight
      );


    document
      .getElementById("vrNormalButton")
      .addEventListener(
        "click",
        clearWeather
      );


    document
      .getElementById("vrRainButton")
      .addEventListener(
        "click",
        createRain
      );


    document
      .getElementById("vrSnowButton")
      .addEventListener(
        "click",
        createSnow
      );

  }
);


/* ========================================
   TIME
======================================== */

function setDay() {

  document
    .getElementById("sky")
    .setAttribute(
      "color",
      "#78bce9"
    );

  document
    .getElementById("ambientLight")
    .setAttribute(
      "light",
      "intensity",
      1
    );

  document
    .getElementById("sunLight")
    .setAttribute(
      "light",
      "intensity",
      2.5
    );

}


function setNight() {

  document
    .getElementById("sky")
    .setAttribute(
      "color",
      "#030612"
    );

  document
    .getElementById("ambientLight")
    .setAttribute(
      "light",
      "intensity",
      .35
    );

  document
    .getElementById("sunLight")
    .setAttribute(
      "light",
      "intensity",
      .8
    );

}


/* ========================================
   WEATHER
======================================== */

function clearWeather() {

  const weather =
    document.getElementById(
      "weather"
    );

  while (
    weather.firstChild
  ) {

    weather.removeChild(
      weather.firstChild
    );

  }

}


function createRain() {

  clearWeather();

  const weather =
    document.getElementById(
      "weather"
    );


  for (
    let i = 0;
    i < 180;
    i++
  ) {

    const drop =
      document.createElement(
        "a-box"
      );

    drop.setAttribute(
      "width",
      ".015"
    );

    drop.setAttribute(
      "height",
      ".5"
    );

    drop.setAttribute(
      "depth",
      ".015"
    );

    drop.setAttribute(
      "color",
      "#9ac8ff"
    );

    drop.setAttribute(
      "position",
      (
        Math.random() * 90 - 45
      ) +
      " " +
      (
        Math.random() * 30
      ) +
      " " +
      (
        Math.random() * 70 - 35
      )
    );

    drop.setAttribute(
      "weather-particle",
      "type: rain"
    );

    weather.appendChild(
      drop
    );

  }

}


function createSnow() {

  clearWeather();

  const weather =
    document.getElementById(
      "weather"
    );


  for (
    let i = 0;
    i < 140;
    i++
  ) {

    const snow =
      document.createElement(
        "a-sphere"
      );

    snow.setAttribute(
      "radius",
      ".05"
    );

    snow.setAttribute(
      "color",
      "white"
    );

    snow.setAttribute(
      "position",
      (
        Math.random() * 90 - 45
      ) +
      " " +
      (
        Math.random() * 30
      ) +
      " " +
      (
        Math.random() * 70 - 35
      )
    );

    snow.setAttribute(
      "weather-particle",
      "type: snow"
    );

    weather.appendChild(
      snow
    );

  }

}


AFRAME.registerComponent(
  "weather-particle",
  {

    schema: {

      type: {
        default: "rain"
      }

    },


    tick: function(
      time,
      delta
    ) {

      const p =
        this.el.object3D.position;

      if (
        this.data.type ===
        "rain"
      ) {

        p.y -=
          delta * .02;

      }

      else {

        p.y -=
          delta * .003;

        p.x +=
          Math.sin(
            time * .002
          ) *
          .001;

      }


      if (p.y < 0) {

        p.y = 30;

      }

    }

  }
);


/* ========================================
   FIELD LINES
======================================== */

function addFieldLine(
  width,
  depth,
  x,
  z
) {

  const lines =
    document.getElementById(
      "fieldLines"
    );

  const line =
    document.createElement(
      "a-box"
    );

  line.setAttribute(
    "width",
    width
  );

  line.setAttribute(
    "height",
    ".025"
  );

  line.setAttribute(
    "depth",
    depth
  );

  line.setAttribute(
    "color",
    "#ffffff"
  );

  line.setAttribute(
    "position",
    x +
    " .02 " +
    z
  );

  lines.appendChild(
    line
  );

}


window.addEventListener(
  "load",
  function () {

    addFieldLine(

/* ========================================
   BALL PHYSICS + KICKING
======================================== */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function () {

      this.velocity =
        new THREE.Vector3();

      this.radius =
        .32;

      this.lastKick =
        0;

    },


    tick: function(
      time,
      delta
    ) {

      const dt =
        Math.min(
          delta / 1000,
          .03
        );

      const ball =
        this.el.object3D;


      /* GRAVITY */

      this.velocity.y -=
        9.8 * dt;


      /* MOVE */

      ball.position.addScaledVector(
        this.velocity,
        dt
      );


      /* GROUND */

      if (
        ball.position.y <
        this.radius
      ) {

        ball.position.y =
          this.radius;

        if (
          this.velocity.y < 0
        ) {

          this.velocity.y *=
            -.32;

        }

        this.velocity.x *=
          .986;

        this.velocity.z *=
          .986;

      }


      /* DRAG */

      this.velocity.multiplyScalar(
        .998
      );


      /* KICK FROM CONTROLLERS */

      const hands = [
        document.getElementById(
          "leftController"
        ),
        document.getElementById(
          "rightController"
        )
      ];


      hands.forEach(
        hand => {

          if (!hand) return;

          const handPos =
            new THREE.Vector3();

          hand.object3D.getWorldPosition(
            handPos
          );


          const distance =
            handPos.distanceTo(
              ball.getWorldPosition(
                new THREE.Vector3()
              )
            );


          if (
            distance < .85 &&
            time - this.lastKick >
            180
          ) {

            const direction =
              new THREE.Vector3(
                0,
                0,
                -1
              );

            hand.object3D.getWorldDirection(
              direction
            );

            direction.normalize();

            this.velocity.add(
              direction.multiplyScalar(
                7
              )
            );

            this.velocity.y +=
              2.5;

            this.lastKick =
              time;

          }

        }
      );


      /* FIELD WALLS */

      if (
        ball.position.x < -53.6 ||
        ball.position.x > 53.6
      ) {

        ball.position.x =
          Math.max(
            -53.6,
            Math.min(
              53.6,
              ball.position.x
            )
          );

        this.velocity.x *=
          -.65;

      }


      if (
        ball.position.z < -36 ||
        ball.position.z > 36
      ) {

        ball.position.z =
          Math.max(
            -36,
            Math.min(
              36,
              ball.position.z
            )
          );

        this.velocity.z *=
          -.65;

      }


      /* ROLL ROTATION */

      ball.rotation.z +=
        this.velocity.x *
        dt *
        2;

      ball.rotation.x -=
        this.velocity.z *
        dt *
        2;

    }

  }
);


/* ========================================
   EDITOR
======================================== */

function selectObject(
  object
) {

  selectedObject =
    object;

  document
    .getElementById(
      "selectedText"
    )
    .textContent =
      object
        ? "Selected: " +
          object.dataset.type
        : "No object selected";

}


function addEditorObject(
  type
) {

  const el =
    document.createElement(
      type
    );

  el.classList.add(
    "clickable"
  );

  el.classList.add(
    "editor-object"
  );

  el.dataset.type =
    type;

  el.setAttribute(
    "position",
    "0 2 -5"
  );


  if (
    type === "a-box"
  ) {

    el.setAttribute(
      "width",
      "3"
    );

    el.setAttribute(
      "height",
      "3"
    );

    el.setAttribute(
      "depth",
      "3"
    );

    el.setAttribute(
      "color",
      "#6633aa"
    );

  }


  if (
    type === "a-sphere"
  ) {

    el.setAttribute(
      "radius",
      "1.5"
    );

    el.setAttribute(
      "color",
      "#6633aa"
    );

  }


  if (
    type === "a-entity"
  ) {

    el.dataset.type =
      "seat row";

    const seat =
      document.createElement(
        "a-box"
      );

    seat.setAttribute(
      "width",
      "6"
    );

    seat.setAttribute(
      "height",
      "1"
    );

    seat.setAttribute(
      "depth",
      "2"
    );

    seat.setAttribute(
      "color",
      "#6739a9"
    );

    el.appendChild(
      seat
    );

  }


  el.addEventListener(
    "click",
    () => {

      if (editorMode) {

        selectObject(el);

      }

    }
  );


  customObjects.appendChild(
    el
  );

  selectObject(
    el
  );

}

/* MOVE */

function moveSelected(
  x,
  y,
  z
) {

  if (!selectedObject) return;

  const p =
    selectedObject.object3D.position;

  p.x += x;
  p.y += y;
  p.z += z;

}


document
  .getElementById("moveLeft")
  .onclick =
    () => moveSelected(-1, 0, 0);

document
  .getElementById("moveRight")
  .onclick =
    () => moveSelected(1, 0, 0);

document
  .getElementById("moveForward")
  .onclick =
    () => moveSelected(0, 0, -1);

document
  .getElementById("moveBack")
  .onclick =
    () => moveSelected(0, 0, 1);

document
  .getElementById("moveUp")
  .onclick =
    () => moveSelected(0, 1, 0);

document
  .getElementById("moveDown")
  .onclick =
    () => moveSelected(0, -1, 0);


/* ROTATE */

document
  .getElementById("rotateLeft")
  .onclick =
    () => {

      if (!selectedObject) return;

      selectedObject.object3D.rotation.y -=
        Math.PI / 12;

    };


document
  .getElementById("rotateRight")
  .onclick =
    () => {

      if (!selectedObject) return;

      selectedObject.object3D.rotation.y +=
        Math.PI / 12;

    };


/* SCALE */

document
  .getElementById("scaleUp")
  .onclick =
    () => {

      if (!selectedObject) return;

      selectedObject.object3D.scale.multiplyScalar(
        1.15
      );

    };


document
  .getElementById("scaleDown")
  .onclick =
    () => {

      if (!selectedObject) return;

      selectedObject.object3D.scale.multiplyScalar(
        .85
      );

    };


/* COLOR */

document
  .getElementById("applyColor")
  .onclick =
    () => {

      if (!selectedObject) return;

      const color =
        document.getElementById(
          "colorPicker"
        ).value;

      selectedObject.setAttribute(
        "color",
        color
      );

      selectedObject.querySelectorAll(
        "[color]"
      ).forEach(
        child => {

          child.setAttribute(
            "color",
            color
          );

        }
      );

    };


/* DELETE */

document
  .getElementById("deleteObject")
  .onclick =
    () => {

      if (
        !selectedObject ||
        !selectedObject.parentNode
      ) return;

      selectedObject.remove();

      selectObject(null);

    };


/* ========================================
   SAVE / LOAD ARENA
======================================== */

function saveArena() {

  const data = [];

  customObjects
    .querySelectorAll(
      ".editor-object"
    )
    .forEach(
      el => {

        data.push(
          {
            tag:
              el.tagName
                .toLowerCase(),

            type:
              el.dataset.type,

            position:
              el.object3D.position.toArray(),

            rotation:
              [
                el.object3D.rotation.x,
                el.object3D.rotation.y,
                el.object3D.rotation.z
              ],

            scale:
              el.object3D.scale.toArray(),

            color:
              el.getAttribute(
                "color"
              )
          }
        );

      }
    );


  localStorage.setItem(
    "false9Arena",
    JSON.stringify(data)
  );

  alert(
    "Arena saved!"
  );

}


function loadArena() {

  const saved =
    localStorage.getItem(
      "false9Arena"
    );

  if (!saved) {

    alert(
      "No saved arena found."
    );

    return;

  }


  customObjects.innerHTML =
    "";

  const data =
    JSON.parse(saved);


  data.forEach(
    item => {

      const el =
        document.createElement(
          item.tag
        );

      el.classList.add(
        "editor-object"
      );

      el.classList.add(
        "clickable"
      );

      el.dataset.type =
        item.type;

      el.object3D.position.fromArray(
        item.position
      );

      el.object3D.rotation.set(
        ...item.rotation
      );

      el.object3D.scale.fromArray(
        item.scale
      );


      if (
        item.color
      ) {

        el.setAttribute(
          "color",
          item.color
        );

      }


      el.addEventListener(
        "click",
        () => {

          if (editorMode) {

            selectObject(el);

          }

        }
      );


      customObjects.appendChild(
        el
      );

    }
  );


  alert(
    "Arena loaded!"
  );

}


/* SAVE BUTTONS */

document
  .getElementById("saveArena")
  .onclick =
    saveArena;


document
  .getElementById("loadArena")
  .onclick =
    loadArena;


document
