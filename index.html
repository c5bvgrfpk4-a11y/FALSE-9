<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* START SCREEN */
#startScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background:

      #241044 0%,
      #090612 55%,
      #000 100%);

  color: white;
}

#startScreen h1 {
  margin: 0;
  font-size: clamp(52px, 11vw, 100px);
  letter-spacing: 10px;
  text-shadow:
    0 0 20px #9b6cff,
    0 0 50px #53229e;
}

#startScreen p {
  letter-spacing: 4px;
  opacity: .8;
}

#teamButtons {
  display: flex;
  gap: 20px;
}

.teamButton {
  width: 210px;
  height: 120px;

  background: #111;
  color: white;

  border-radius: 16px;

  font-size: 28px;
  font-weight: bold;

  cursor: pointer;
}

#homeButton {
  border: 3px solid #ff3333;
}

#awayButton {
  border: 3px solid #3388ff;
}

.teamButton:active {
  transform: scale(.96);
}
</style>

      </a-box>

      <a-text

  <a-entity

    </a-sphere>

    <a-sphere
      radius=".285"
      scale=".40 .40 .06"
      position="0 .18 -.22"
      color="#111">
    </a-sphere>

    <a-sphere
      radius=".285"
      scale=".40 .06 .40"

    </a-sphere>

  </a-entity>

    id="stadium"

  </a-entity>

    <a-box

      height="6"
      depth=".5"
      color="#090912">

    <a-text
      id="scoreText"

<script>

/* =====================================
   TEAM SELECTION
===================================== */

let selectedTeam = null;

const startScreen =
  document.getElementById("startScreen");

const rig =
  document.getElementById("rig");

document
  .getElementById("homeButton")
  .addEventListener("click", () => {

    selectedTeam = "home";

    rig.setAttribute(
      "position",
      "-10 1.6 22"
    );

    startScreen.style.display = "none";

  });


document
  .getElementById("awayButton")
  .addEventListener("click", () => {

    selectedTeam = "away";

    rig.setAttribute(
      "position",
      "10 1.6 -22"
    );

    startScreen.style.display = "none";

  });



/* =====================================
   SCORE
===================================== */

let homeScore = 0;
let awayScore = 0;

function updateScore() {

  document
    .getElementById("scoreText")
    .setAttribute(
      "value",
      `HOME  ${homeScore}  -  ${awayScore}  AWAY`
    );

}


function resetBall() {

  const ball =
    document.getElementById("ball");

  ball.object3D.position.set(
    0,
    .28,
    0
  );

  const physics =
    ball.components["ball-physics"];

  if (physics) {

    physics.velocity.set(
      0,
      0,
      0
    );

  }

}


let scoring = false;

function scoreGoal(team) {

  if (scoring) return;

  scoring = true;

  if (team === "home") {
    homeScore++;
  } else {
    awayScore++;
  }

  updateScore();

  setTimeout(() => {

    resetBall();

    scoring = false;

  }, 1200);

}



/* =====================================
   BOOT KICKING
===================================== */

AFRAME.registerComponent(
  "boot-kick",
  {

    init: function () {

      this.lastPosition =
        new THREE.Vector3();

      this.currentPosition =
        new THREE.Vector3();

      this.velocity =
        new THREE.Vector3();

      this.lastKick =
        0;

      this.el.object3D.getWorldPosition(
        this.lastPosition
      );

    },


    tick: function(time, delta) {

      const ball =
        document.getElementById("ball");

      if (!ball) return;

      const ballPhysics =
        ball.components["ball-physics"];

      if (!ballPhysics) return;


      this.el.object3D.getWorldPosition(
        this.currentPosition
      );


      const dt =
        Math.max(
          delta / 1000,
          .001
        );


      this.velocity
        .subVectors(
          this.currentPosition,
          this.lastPosition
        )
        .divideScalar(dt);


      const ballPos =
        new THREE.Vector3();

      ball.object3D.getWorldPosition(
        ballPos
      );


      const distance =
        this.currentPosition.distanceTo(
          ballPos
        );


      if (
        distance < .65 &&
        time - this.lastKick > 180
      ) {

        const speed =
          this.velocity.length();


        if (speed > .8) {

          const direction =
            new THREE.Vector3()
              .subVectors(
                ballPos,
                this.currentPosition
              )
              .normalize();


          direction.y =
            Math.max(
              .12,
              direction.y
            );


          ballPhysics.velocity.addScaledVector(
            direction,
            Math.min(
              speed * 1.25,
              18
            )
          );


          ballPhysics.velocity.y +=
            Math.min(
              speed * .08,
              2.5
            );


          this.lastKick =
            time;

        }

      }


      this.lastPosition.copy(
        this.currentPosition
      );

    }

  }
);



/* =====================================
   BALL PHYSICS
===================================== */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function() {

      this.velocity =
        new THREE.Vector3();

      this.radius =
        .28;

    },


    tick: function(time, delta) {

      const ball =
        this.el.object3D;

      const dt =
        Math.min(
          delta / 1000,
          .03
        );


      /* GRAVITY */

      this.velocity.y -=
        9.8 * dt;


      /* MOVE */

      ball.position.addScaledVector(
        this.velocity,
        dt
      );


      /* GROUND */

      if (
        ball.position.y <
        this.radius
      ) {

        ball.position.y =
          this.radius;


        if (
          this.velocity.y < 0
        ) {

          this.velocity.y *=
            -.28;

        }


        this.velocity.x *= .985;

        this.velocity.z *= .985;

      }


      /* AIR DRAG */

      this.velocity.multiplyScalar(
        .998
      );


      /* STOP TINY MOVEMENT */

      if (
        Math.abs(this.velocity.x) <
        .02
      ) {

        this.velocity.x = 0;

      }


      if (
        Math.abs(this.velocity.z) <
        .02
      ) {

        this.velocity.z = 0;

      }


      /* SIDE WALLS */

      if (
        ball.position.x <
        -53.5
      ) {

        ball.position.x =
          -53.5;

        this.velocity.x *=
          -.65;

      }


      if (
        ball.position.x >
        53.5
      ) {

        ball.position.x =
          53.5;

        this.velocity.x *=
          -.65;

      }


      /* NORTH GOAL */

      if (
        ball.position.z <
        -34
      ) {

        const insideGoal =
          Math.abs(
            ball.position.x
          ) < 3.35 &&
          ball.position.y < 2.3;


        if (insideGoal) {

          if (
            ball.position.z <
            -35.2
          ) {

            scoreGoal(
              "away"
            );

          }

        }

        else {

          ball.position.z =
            -33.7;

          this.velocity.z *=
            -.65;

        }

      }


      /* SOUTH GOAL */

      if (
        ball.position.z >
        34
      ) {

        const insideGoal =
          Math.abs(
            ball.position.x
          ) < 3.35 &&
          ball.position.y < 2.3;


        if (insideGoal) {

          if (
            ball.position.z >
            35.2
          ) {

            scoreGoal(
              "home"
            );

          }

        }

        else {

          ball.position.z =
            33.7;

          this.velocity.z *=
            -.65;

        }

      }


      /* BACK NET */

      if (
        ball.position.z <
        -36
      ) {

        ball.position.z =
          -36;

        this.velocity.z *=
          -.4;

      }


      if (
        ball.position.z >
        36
      ) {

        ball.position.z =
          36;

        this.velocity.z *=
          -.4;

      }


      /* ROTATION */

      ball.rotation.z +=
        this.velocity.x *
        dt *
        3;


      ball.rotation.x -=
        this.velocity.z *
        dt *
        3;

    }

  }
);



/* =====================================
   GOALS
===================================== */

AFRAME.registerComponent(
  "goal",
  {

    init: function() {

      const goal =
        this.el;

      const width =
        7.2;

      const height =
        2.3;

      const depth =
        2.2;


      function bar(
        x, y, z,
        w, h, d,
        color = "white"
      ) {

        const el =
          document.createElement(
            "a-box"
          );

        el.setAttribute(
          "position",
          `${x} ${y} ${z}`
        );

        el.setAttribute(
          "width",
          w
        );

        el.setAttribute(
          "height",
          h
        );

        el.setAttribute(
          "depth",
          d
        );

        el.setAttribute(
          "color",
          color
        );

        goal.appendChild(el);

      }


      /* POSTS */

      bar(
        -width / 2,
        height / 2,
        0,
        .16,
        height,
        .16
      );

      bar(
        width / 2,
        height / 2,
        0,
        .16,
        height,
        .16
      );


      /* CROSSBAR */

      bar(
        0,
        height,
        0,
        width,
        .16,
        .16
      );


      /* BACK */

      bar(
        0,
        height,
        depth,
        width,
        .10,
        .10,
        "#dddddd"
      );

      bar(
        -width / 2,
        height / 2,
        depth,
        .10,
        height,
        .10,
        "#dddddd"
      );

      bar(
        width / 2,
        height / 2,
        depth,
        .10,
        height,
        .10,
        "#dddddd"
      );

    }

  }
);



/* =====================================
   FIELD LINES
===================================== */

window.addEventListener(
  "load",
  () => {

    const lines =
      document.getElementById(
        "fieldLines"
      );


    function addLine(
      width,
      depth,
      x,
      z
    ) {

      const line =
        document.createElement(
          "a-box"
        );

      line.setAttribute(
        "width",
        width
      );

      line.setAttribute(
        "height",
        ".025"
      );

      line.setAttribute(
        "depth",
        depth
      );

      line.setAttribute(
        "color",
        "white"
      );

      line.setAttribute(
        "position",
        `${x} .02 ${z}`
      );

      lines.appendChild(
        line
      );

    }


    /* OUTSIDE */

    addLine(
      108, .12,
      0, -34
    );

    addLine(
      108, .12,
      0, 34
    );

    addLine(
      .12, 68,
      -54, 0
    );

    addLine(
      .12, 68,
      54, 0
    );


    /* CENTER */

    addLine(
      108, .10,
      0, 0
    );


    const circle =
      document.createElement(
        "a-ring"
      );

    circle.setAttribute(
      "rotation",
      "-90 0 0"
    );

    circle.setAttribute(
      "radius-inner",
      "9.05"
    );

    circle.setAttribute(
      "radius-outer",
      "9.13"
    );

    circle.setAttribute(
      "color",
      "white"
    );

    circle.setAttribute(
      "position",
      "0 .02 0"
    );

    lines.appendChild(
      circle
    );

  }
);



/* =====================================
   STADIUM
===================================== */

AFRAME.registerComponent(
  "stadium-maker",
  {

    init: function() {

      const stadium =
        this.el;


      function block(
        x, y, z,
        w, h, d,
        color
      ) {

        const b =
          document.createElement(
            "a-box"
          );

        b.setAttribute(
          "position",
          `${x} ${y} ${z}`
        );

        b.setAttribute(
          "width",
          w
        );

        b.setAttribute(
          "height",
          h
        );

        b.setAttribute(
          "depth",
          d
        );

        b.setAttribute(
          "color",
          color
        );

        stadium.appendChild(
          b
        );

      }


      for (
        let tier = 0;
        tier < 14;
        tier++
      ) {

        const y =
          1 +
          tier * .8;

        const expand =
          tier * 1.2;

        const color =
          tier % 2 === 0
            ? "#552a91"
            : "#6a3dad";


        block(
          0,
          y,
          -38 - expand,
          125 + expand * 2,
          .75,
          2.5,
          color
        );

        block(
          0,
          y,
          38 + expand,
          125 + expand * 2,
          .75,
          2.5,
          color
        );

        block(
          -58 - expand,
          y,
          0,
          2.5,
          .75,
          82 + expand * 2,
          color
        );

        block(
          58 + expand,
          y,
          0,
          2.5,
          .75,
          82 + expand * 2,
          color
        );

      }


      /* ROOF */

      block(
        0, 25, -62,
        155, 2, 18,
        "#15151e"
      );

      block(
        0, 25, 62,
        155, 2, 18,
        "#15151e"
      );

      block(
        -74, 25, 0,
        18, 2, 110,
        "#15151e"
      );

      block(
        74, 25, 0,
        18, 2, 110,
        "#15151e"
      );

    }

  }
);



/* =====================================
   MENU
===================================== */

const menu =
  document.getElementById(
    "vrMenu"
  );

document
  .getElementById(
    "menuButton"
  )
  .addEventListener(
    "click",
    () => {

      menu.setAttribute(
        "visible",
        !menu.getAttribute(
          "visible"
        )
      );

    }
  );



/* =====================================
   TIME
===================================== */

function setTime(
  skyColor,
  ambient,
  sun
) {

  document
    .getElementById("sky")
    .setAttribute(
      "color",
      skyColor
    );

  document
    .getElementById("ambientLight")
    .setAttribute(
      "light",
      "intensity",
      ambient
    );

  document
    .getElementById("sunLight")
    .setAttribute(
      "light",
      "intensity",
      sun
    );

}

/* =====================================
   WEATHER
===================================== */

const weather =
  document.getElementById(
    "weather"
  );


function clearWeather() {

  while (
    weather.firstChild
  ) {

    weather.removeChild(
      weather.firstChild
    );

  }

}


function createRain() {

  clearWeather();

  for (
    let i = 0;
    i < 180;
    i++
  ) {

    const drop =
      document.createElement(
        "a-box"
      );

    drop.setAttribute(
      "width",
      ".015"
    );

    drop.setAttribute(
      "height",
      ".45"
    );

    drop.setAttribute(
      "depth",
      ".015"
    );

    drop.setAttribute(
      "color",
      "#9ac8ff"
    );

    drop.setAttribute(
      "position",
      `${Math.random()*70-35}
       ${Math.random()*25}
       ${Math.random()*70-35}`
    );

    drop.setAttribute(
      "weather-drop",
      "type: rain"
    );

    weather.appendChild(
      drop
    );

  }

}


function createSnow() {

  clearWeather();

  for (
    let i = 0;
    i < 140;
    i++
  ) {

    const flake =
      document.createElement(
        "a-sphere"
      );

    flake.setAttribute(
      "radius",
      ".04"
    );

    flake.setAttribute(
      "color",
      "white"
    );

    flake.setAttribute(
      "position",
      `${Math.random()*70-35}
       ${Math.random()*25}
       ${Math.random()*70-35}`
    );

    flake.setAttribute(
      "weather-drop",
      "type: snow"
    );

    weather.appendChild(
      flake
    );

  }

}


document
  .getElementById(
    "normalButton"
  )
  .addEventListener(
    "click",
    clearWeather
  );


document
  .getElementById(
    "rainButton"
  )
  .addEventListener(
    "click",
    createRain
  );


document
  .getElementById(
    "snowButton"
  )
  .addEventListener(
    "click",
    createSnow
  );



/* =====================================
   WEATHER MOVEMENT
===================================== */

AFRAME.registerComponent(
  "weather-drop",
  {

    schema: {

      type: {
        default: "rain"
      }

    },


    tick: function(
      time,
      delta
    ) {

      const pos =
        this.el.object3D.position;


      if (
        this.data.type ===
        "rain"
      ) {

        pos.y -=
          delta * .018;

      }

      else {

        pos.y -=
          delta * .003;

        pos.x +=
          Math.sin(
            time * .002
          ) * .002;

      }


      if (
        pos.y < 0
      ) {

        pos.y =
          25;

      }

    }

  }
);

</script>
