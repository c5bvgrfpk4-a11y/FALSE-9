<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}


/* =========================
   START SCREEN
========================= */

#startScreen {

  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background:
    radial-gradient(
      circle,
      #20143d 0%,
      #080812 60%,
      #000000 100%
    );

  color: white;

}


#startScreen h1 {

  font-size: clamp(55px, 10vw, 100px);

  letter-spacing: 12px;

  margin: 0;

  text-shadow:
    0 0 20px #8d55ff,
    0 0 60px #5522aa;

}


#startScreen p {

  letter-spacing: 4px;

  opacity: .75;

  margin-bottom: 35px;

}


#teamButtons {

  display: flex;

  gap: 25px;

}


.teamButton {

  width: 220px;

  height: 130px;

  border-radius: 15px;

  background: #111;

  color: white;

  font-size: 28px;

  font-weight: bold;

  cursor: pointer;

}


#homeButton {

  border: 3px solid #ff3333;

}


#awayButton {

  border: 3px solid #3388ff;

}


.teamButton:active {

  transform: scale(.96);

}

</style>

</head>


<body>


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

  <h1>FALSE 9</h1>

  <p>CHOOSE YOUR TEAM</p>

  <div id="teamButtons">

    <button
      id="homeButton"
      class="teamButton">

      HOME

    </button>


    <button
      id="awayButton"
      class="teamButton">

      AWAY

    </button>

  </div>

</div>

========================= -->

  renderer="

    colorManagement: true;

  ========================= -->

    position="0 1.6 25">

    <!-- LEFT CONTROLLER -->

        objects: .clickable;

        <!-- ROUND TOE -->

        <!-- BLACK SOLE -->

        <!-- HEEL -->

        </a-box>


        <a-box

          height=".025"

          color="white">
        </a-box>


        <a-box
          width=".21"
          height=".025"
          depth=".035"

        </a-box>


        <a-box
          width=".20"
          height=".025"
          depth=".035"

      </a-entity>

    </a-entity>



    <!-- RIGHT CONTROLLER -->

      raycaster="

        far: 30

        </a-box>

        <a-box
          width=".21"
          height=".025"
          depth=".035"
          position="0 .11 -.16"
          color="white">
        </a-box>


        <a-box
          width=".21"
          height=".025"
          depth=".035"
          position="0 .11 -.07"

        </a-box>


        <a-box
          width=".21"
          height=".025"

          color="white">
        </a-box>

  </a-plane>

    </a-box>

<script>


/* =========================================
   RANDOM LOBBY CODE

   EXACT FORMAT:

   A-123456
========================================= */

function generateLobbyCode() {

  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const letter =
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ];

  const numbers =
    Math.floor(
      100000 +
      Math.random() *
      900000
    );

  return (
    letter +
    "-" +
    numbers
  );

}


let lobbyCode =
  generateLobbyCode();



/* =========================================
   WAIT FOR SCENE
========================================= */

const scene =
  document.getElementById("scene");


scene.addEventListener(
  "loaded",
  function () {


    /* =========================
       START
    ========================= */

    const startScreen =
      document.getElementById(
        "startScreen"
      );


    const rig =
      document.getElementById(
        "rig"
      );


    document
      .getElementById("homeButton")
      .addEventListener(
        "click",
        function () {

          startScreen.style.display =
            "none";

          rig.setAttribute(
            "position",
            "-10 1.6 22"
          );

        }
      );


    document
      .getElementById("awayButton")
      .addEventListener(
        "click",
        function () {

          startScreen.style.display =
            "none";

          rig.setAttribute(
            "position",
            "10 1.6 -22"
          );

        }
      );



    /* =========================
       MENU
    ========================= */

    const menu =
      document.getElementById(
        "vrMenu"
      );


    document
      .getElementById(
        "menuButton"
      )
      .addEventListener(
        "click",
        function () {

          menu.setAttribute(
            "visible",
            !menu.getAttribute(
              "visible"
            )
          );

        }
      );



    /* =========================
       LOBBY CODE
    ========================= */

    function updateLobbyCode() {

      document
        .getElementById(
          "lobbyCodeText"
        )
        .setAttribute(
          "value",
          lobbyCode
        );

    }


    updateLobbyCode();


    document
      .getElementById(
        "newCodeButton"
      )
      .addEventListener(
        "click",
        function () {

          lobbyCode =
            generateLobbyCode();

          updateLobbyCode();

        }
      );



    /* =========================
       TIME
    ========================= */

    function setDay() {

      document
        .getElementById("sky")
        .setAttribute(
          "color",
          "#78b9e8"
        );


      document
        .getElementById("ambientLight")
        .setAttribute(
          "light",
          "intensity",
          1
        );


      document
        .getElementById("sunLight")
        .setAttribute(
          "light",
          "intensity",
          2.5
        );

    }



    function setSunset() {

      document
        .getElementById("sky")
        .setAttribute(
          "color",
          "#b65b4a"
        );


      document
        .getElementById("ambientLight")
        .setAttribute(
          "light",
          "intensity",
          .65
        );


      document
        .getElementById("sunLight")
        .setAttribute(
          "light",
          "intensity",
          1.4
        );

    }



    function setNight() {

      document
        .getElementById("sky")
        .setAttribute(
          "color",
          "#02030a"
        );


      document
        .getElementById("ambientLight")
        .setAttribute(
          "light",
          "intensity",
          .3
        );


      document
        .getElementById("sunLight")
        .setAttribute(
          "light",
          "intensity",
          .5
        );

    }



    document
      .getElementById(
        "dayButton"
      )
      .addEventListener(
        "click",
        setDay
      );


    document
      .getElementById(
        "sunsetButton"
      )
      .addEventListener(
        "click",
        setSunset
      );


    document
      .getElementById(
        "nightButton"
      )
      .addEventListener(
        "click",
        setNight
      );



    /* =========================
       WEATHER
    ========================= */

    const weather =
      document.getElementById(
        "weather"
      );


    function clearWeather() {

      while (
        weather.firstChild
      ) {

        weather.removeChild(
          weather.firstChild
        );

      }

    }



    function createRain() {

      clearWeather();


      for (
        let i = 0;
        i < 250;
        i++
      ) {

        const drop =
          document.createElement(
            "a-box"
          );


        drop.setAttribute(
          "width",
          ".015"
        );


        drop.setAttribute(
          "height",
          ".45"
        );


        drop.setAttribute(
          "depth",
          ".015"
        );


        drop.setAttribute(
          "color",
          "#88bbff"
        );


        drop.setAttribute(
          "position",
          (
            Math.random() * 70 - 35
          ) +
          " " +
          (
            Math.random() * 25
          ) +
          " " +
          (
            Math.random() * 70 - 35
          )
        );


        drop.setAttribute(
          "weather-drop",
          "type: rain"
        );


        weather.appendChild(
          drop
        );

      }

    }



    function createSnow() {

      clearWeather();


      for (
        let i = 0;
        i < 180;
        i++
      ) {

        const flake =
          document.createElement(
            "a-sphere"
          );


        flake.setAttribute(
          "radius",
          ".04"
        );


        flake.setAttribute(
          "color",
          "white"
        );


        flake.setAttribute(
          "position",
          (
            Math.random() * 70 - 35
          ) +
          " " +
          (
            Math.random() * 25
          ) +
          " " +
          (
            Math.random() * 70 - 35
          )
        );


        flake.setAttribute(
          "weather-drop",
          "type: snow"
        );


        weather.appendChild(
          flake
        );

      }

    }



    document
      .getElementById(
        "normalButton"
      )
      .addEventListener(
        "click",
        clearWeather
      );


    document
      .getElementById(
        "rainButton"
      )
      .addEventListener(
        "click",
        createRain
      );


    document
      .getElementById(
        "snowButton"
      )
      .addEventListener(
        "click",
        createSnow
      );


    setNight();

  }
);



/* =========================================
   WEATHER MOVEMENT
========================================= */

AFRAME.registerComponent(
  "weather-drop",
  {

    schema: {

      type: {
        default: "rain"
      }

    },


    tick: function (
      time,
      delta
    ) {

      if (
        this.data.type ===
        "rain"
      ) {

        this.el.object3D.position.y -=
          delta *
          .018;

      }

      else {

        this.el.object3D.position.y -=
          delta *
          .003;

        this.el.object3D.position.x +=
          Math.sin(
            time * .002
          ) *
          .002;

      }


      if (
        this.el.object3D.position.y <
        0
      ) {

        this.el.object3D.position.y =
          25;

      }

    }

  }
);



/* =========================================
   FIELD LINES
========================================= */

window.addEventListener(
  "load",
  function () {


    const lines =
      document.getElementById(
        "fieldLines"
      );


    function line(
      width,
      depth,
      x,
      z
    ) {

      const el =
        document.createElement(
          "a-box"
        );


      el.setAttribute(
        "width",
        width
      );


      el.setAttribute(
        "height",
        ".025"
      );


      el.setAttribute(
        "depth",
        depth
      );


      el.setAttribute(
        "color",
        "white"
      );


      el.setAttribute(
        "position",
        x +
        " .02 " +
        z
      );


      lines.appendChild(el);

    }


    line(
      108,
      .12,
      0,
      -34
    );


    line(
      108,
      .12,
      0,
      34
    );


    line(
      .12,
      68,
      -54,
      0
    );


    line(
      .12,
      68,
      54,
      0
    );


    line(
      108,
      .10,
      0,
      0
    );


    const circle =
      document.createElement(
        "a-ring"
      );


    circle.setAttribute(
      "rotation",
      "-90 0 0"
    );


    circle.setAttribute(
      "radius-inner",
      "9.05"
    );


    circle.setAttribute(
      "radius-outer",
      "9.13"
    );


    circle.setAttribute(
      "color",

/* =========================================
   STADIUM
========================================= */

AFRAME.registerComponent(
  "stadium-maker",
  {

    init: function () {

      const stadium =
        this.el;


      function block(
        x,
        y,
        z,
        w,
        h,
        d,
        color
      ) {

        const b =
          document.createElement(
            "a-box"
          );


        b.setAttribute(
          "position",
          x +
          " " +
          y +
          " " +
          z
        );


        b.setAttribute(
          "width",
          w
        );


        b.setAttribute(
          "height",
          h
        );


        b.setAttribute(
          "depth",
          d
        );


        b.setAttribute(
          "color",
          color
        );


        stadium.appendChild(b);

      }



      /*
       PURPLE STADIUM TIERS
      */

      for (
        let tier = 0;
        tier < 16;
        tier++
      ) {

        const y =
          1 +
          tier *
          .72;


        const expand =
          tier *
          1.25;


        const purple =
          tier % 2 === 0
            ? "#54278f"
            : "#6939aa";


        /* LONG SIDES */

        block(
          0,
          y,
          -38 - expand,
          125 + expand * 2,
          .68,
          2.4,
          purple
        );


        block(
          0,
          y,
          38 + expand,
          125 + expand * 2,
          .68,
          2.4,
          purple
        );


        /* END SIDES */

        block(
          -58 - expand,
          y,
          0,
          2.4,
          .68,
          82 + expand * 2,
          purple
        );


        block(
          58 + expand,
          y,
          0,
          2.4,
          .68,
          82 + expand * 2,
          purple
        );

      }



      /*
       WHITE LED RINGS
      */

      for (
        let level = 0;
        level < 3;
        level++
      ) {

        const y =
          4 +
          level *
          5;


        block(
          0,
          y,
          -49 - level * 5,
          145,
          .25,
          .7,
          "#f3efff"
        );


        block(
          0,
          y,
          49 + level * 5,
          145,
          .25,
          .7,
          "#f3efff"
        );

      }



      /*
       ROOF STRUCTURE
      */

      const roofY =
        27;


      block(
        0,
        roofY,
        -66,
        160,
        1.5,
        18,
        "#171724"
      );


      block(
        0,
        roofY,
        66,
        160,
        1.5,
        18,
        "#171724"
      );


      block(
        -78,
        roofY,
        0,
        18,
        1.5,
        120,
        "#171724"
      );


      block(
        78,
        roofY,
        0,
        18,
        1.5,
        120,
        "#171724"
      );


    }

  }
);



/* =========================================
   BALL PHYSICS
========================================= */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function () {

      this.velocity =
        new THREE.Vector3();

    },


    tick: function (
      time,
      delta
    ) {

      const dt =
        Math.min(
          delta / 1000,
          .03
        );


      this.velocity.y -=
        9.8 *
        dt;


      this.el.object3D.position.addScaledVector(
        this.velocity,
        dt
      );


      if (
        this.el.object3D.position.y <
        .28
      ) {

        this.el.object3D.position.y =
          .28;


        if (
          this.velocity.y < 0
        ) {

          this.velocity.y *=
            -.25;

        }


        this.velocity.x *=
          .985;


        this.velocity.z *=
          .985;

      }


      this.velocity.multiplyScalar(
        .998
      );

    }

  }
);


</script>
