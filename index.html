<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>FALSE 9</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #080808;
      color: white;
    }

    #menu h1 {
      margin: 0 0 15px 0;
      font-size: 70px;
      letter-spacing: 8px;
    }

    #menu p {
      margin: 0 0 30px 0;
      font-size: 18px;
    }

    #buttons {
      display: flex;
      gap: 20px;
    }

    button {
      width: 180px;
      height: 100px;

      font-size: 28px;
      font-weight: bold;

      color: white;
      background: #151515;

      border: 3px solid white;
      border-radius: 12px;
    }

    #home {
      border-color: #e53935;
    }

    #away {
      border-color: #2196f3;
    }
  </style>
</head>


<body>


  <!-- =====================
       TEAM MENU
  ====================== -->

  <div id="menu">

    <h1>FALSE 9</h1>

    <p>CHOOSE YOUR TEAM</p>

    <div id="buttons">

      <button id="home">
        HOME
      </button>

      <button id="away">
        AWAY
      </button>

    </div>

  </div>



  <!-- =====================
       VR GAME
  ====================== -->

  <a-scene
    id="scene"

    vr-mode-ui="enabled: true"

    loading-screen="enabled: false"

    embedded

    renderer="antialias: true"

  >


    <!-- SKY -->

    <a-sky
      color="#87CEEB">
    </a-sky>



    <!-- LIGHT -->

    <a-entity

      light="
        type: directional;
        intensity: 1.5
      "

      position="-10 20 10"

    ></a-entity>


    <a-entity

      light="
        type: ambient;
        intensity: 1
      "

    ></a-entity>



    <!-- PLAYER -->

    <a-entity
      id="player"
      position="0 1.6 25"
    >

      <a-camera
        id="camera"

        look-controls="enabled: true"

        wasd-controls="enabled: true"

      ></a-camera>

    </a-entity>



    <!-- =====================
         FOOTBALL FIELD
    ====================== -->

    <a-plane

      rotation="-90 0 0"

      width="100"

      height="65"

      color="#2e7d32"

      position="0 0 0"

    ></a-plane>



    <!-- CENTER LINE -->

    <a-box

      width="100"

      height="0.05"

      depth="0.2"

      color="#ffffff"

      position="0 0.03 0"

    ></a-box>



    <!-- CENTER CIRCLE -->

    <a-ring

      rotation="-90 0 0"

      radius-inner="8.8"

      radius-outer="9"

      color="#ffffff"

      position="0 0.04 0"

    ></a-ring>



    <!-- CENTER SPOT -->

    <a-cylinder

      radius="0.15"

      height="0.05"

      color="#ffffff"

      position="0 0.05 0"

    ></a-cylinder>



    <!-- =====================
         BALL
    ====================== -->

    <a-sphere

      id="ball"

      position="0 0.5 0"

      radius="0.5"

      color="#ffffff"

    ></a-sphere>



    <!-- =====================
         NORTH GOAL
    ====================== -->

    <a-entity
      position="0 0 -32"
    >

      <!-- POSTS -->

      <a-box
        position="-4 1.5 0"
        width="0.2"
        height="3"
        depth="0.2"
        color="#ffffff"
      ></a-box>


      <a-box
        position="4 1.5 0"
        width="0.2"
        height="3"
        depth="0.2"
        color="#ffffff"
      ></a-box>


      <!-- CROSSBAR -->

      <a-box
        position="0 3 0"
        width="8"
        height="0.2"
        depth="0.2"
        color="#ffffff"
      ></a-box>

    </a-entity>



    <!-- =====================
         SOUTH GOAL
    ====================== -->

    <a-entity
      position="0 0 32"
    >

      <!-- POSTS -->

      <a-box
        position="-4 1.5 0"
        width="0.2"
        height="3"
        depth="0.2"
        color="#ffffff"
      ></a-box>


      <a-box
        position="4 1.5 0"
        width="0.2"
        height="3"
        depth="0.2"
        color="#ffffff"
      ></a-box>


      <!-- CROSSBAR -->

      <a-box
        position="0 3 0"
        width="8"
        height="0.2"
        depth="0.2"
        color="#ffffff"
      ></a-box>

    </a-entity>



    <!-- =====================
         SIMPLE STANDS
    ====================== -->

    <a-box

      position="0 4 -40"

      width="110"

      height="8"

      depth="5"

      color="#5b2a86"

    ></a-box>


    <a-box

      position="0 4 40"

      width="110"

      height="8"

      depth="5"

      color="#5b2a86"

    ></a-box>


    <a-box

      position="-55 4 0"

      width="5"

      height="8"

      depth="85"

      color="#5b2a86"

    ></a-box>


    <a-box

      position="55 4 0"

      width="5"

      height="8"

      depth="85"

      color="#5b2a86"

    ></a-box>


  </a-scene>



  <!-- =====================
       GAME JAVASCRIPT
  ====================== -->

  <script>

    window.addEventListener(
      "DOMContentLoaded",
      function () {

        const menu =
          document.getElementById("menu");

        const player =
          document.getElementById("player");


        document
          .getElementById("home")
          .addEventListener(
            "click",
            function () {

              /*
                Spawn on the SOUTH side
                looking toward the ball.
              */

              player.setAttribute(
                "position",
                "0 1.6 25"
              );

              player.setAttribute(
                "rotation",
                "0 180 0"
              );

              menu.style.display =
                "none";

            }
          );


        document
          .getElementById("away")
          .addEventListener(
            "click",
            function () {

              /*
                Spawn on the NORTH side
                looking toward the ball.
              */

              player.setAttribute(
                "position",
                "0 1.6 -25"
              );

              player.setAttribute(
                "rotation",
                "0 0 0"
              );

              menu.style.display =
                "none";

            }
          );

      }
    );

  </script>


</body>
</html>
