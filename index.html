<script>


/* =========================================
   GLOBAL GAME STATE
========================================= */

let homeScore = 0;
let awayScore = 0;

let lobbyCode = "";


/* =========================================
   LOBBY CODE
========================================= */

function generateLobbyCode() {

  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const letter =
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ];

  const number =
    Math.floor(
      100000 +
      Math.random() *
      900000
    );

  return letter + "-" + number;
}


function updateLobbyCode() {

  document
    .getElementById("lobbyCodeText")
    .setAttribute(
      "value",
      lobbyCode
    );

}



/* =========================================
   SCORE
========================================= */

function updateScore() {

  document
    .getElementById("scoreText")
    .setAttribute(
      "value",

      "HOME  " +
      homeScore +
      "  -  " +
      awayScore +
      "  AWAY"
    );

}


function scoreGoal(team) {

  if (
    window.goalCooldown
  ) {
    return;
  }

  window.goalCooldown = true;


  if (
    team === "home"
  ) {
    homeScore++;
  }

  else {
    awayScore++;
  }


  updateScore();


  setTimeout(
    function () {

      resetBall();

      window.goalCooldown =
        false;

    },
    1200
  );

}


function resetBall() {

  const ball =
    document.getElementById(
      "ball"
    );

  ball.object3D.position.set(
    0,
    .30,
    0
  );


  const physics =
    ball.components[
      "ball-physics"
    ];


  if (
    physics
  ) {

    physics.velocity.set(
      0,
      0,
      0
    );

  }

}



/* =========================================
   MENU TOGGLE COMPONENT

   CLICK THE THREE LINES
   OR PRESS LEFT CONTROLLER BUTTON
========================================= */

AFRAME.registerComponent(
  "menu-toggle",
  {

    init: function () {

      const menu =
        document.getElementById(
          "vrMenu"
        );


      const toggle =
        function () {

          const current =
            menu.getAttribute(
              "visible"
            );


          menu.setAttribute(
            "visible",
            !current
          );

        };


      this.el.addEventListener(
        "click",
        toggle
      );


      const controller =
        document.getElementById(
          "leftController"
        );


      controller.addEventListener(
        "abuttondown",
        toggle
      );


      controller.addEventListener(
        "xbuttondown",
        toggle
      );

    }

  }
);



/* =========================================
   WEATHER MOVEMENT
========================================= */

AFRAME.registerComponent(
  "weather-particle",
  {

    schema: {

      type: {
        default: "rain"
      }

    },


    tick: function(
      time,
      delta
    ) {

      const pos =
        this.el.object3D.position;


      if (
        this.data.type ===
        "rain"
      ) {

        pos.y -=
          delta *
          .018;

      }

      else {

        pos.y -=
          delta *
          .003;


        pos.x +=
          Math.sin(
            time *
            .003 +
            pos.z
          ) *
          .002;

      }


      if (
        pos.y < -2
      ) {

        pos.y =
          14 +
          Math.random() *
          8;

      }

    }

  }
);



/* =========================================
   BOOT KICKING

   WHEN BOOT GETS CLOSE TO BALL
   BALL IS KICKED AWAY
========================================= */

AFRAME.registerComponent(
  "boot-kicker",
  {

    init: function () {

      this.lastKick = 0;

      this.worldPosition =
        new THREE.Vector3();

    },


    tick: function(
      time
    ) {

      const ball =
        document.getElementById(
          "ball"
        );


      const ballPhysics =
        ball.components[
          "ball-physics"
        ];


      if (
        !ballPhysics
      ) {
        return;
      }


      this.el.object3D.getWorldPosition(
        this.worldPosition
      );


      const ballPosition =
        ball.object3D.position;


      const distance =
        this.worldPosition.distanceTo(
          ballPosition
        );


      if (
        distance >
        1.0
      ) {
        return;
      }


      if (
        time -
        this.lastKick <
        350
      ) {
        return;
      }


      this.lastKick =
        time;


      const direction =
        new THREE.Vector3();

      direction.subVectors(
        ballPosition,
        this.worldPosition
      );


      direction.y =
        .15;


      if (
        direction.length() <
        .01
      ) {

        direction.z =
          -1;

      }


      direction.normalize();


      const power =
        12;


      ballPhysics.velocity.addScaledVector(
        direction,
        power
      );


      ballPhysics.velocity.y +=
        2.2;

    }

  }
);



/* =========================================
   BALL PHYSICS
========================================= */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function () {

      this.velocity =
        new THREE.Vector3();

      this.radius =
        .30;

    },


    tick: function(
      time,
      delta
    ) {

      const dt =
        Math.min(
          delta / 1000,
          .03
        );


      const ball =
        this.el.object3D;



      /* GRAVITY */

      this.velocity.y -=
        9.8 *
        dt;



      /* MOVE */

      ball.position.addScaledVector(
        this.velocity,
        dt
      );



      /* GROUND */

      if (
        ball.position.y <
        this.radius
      ) {

        ball.position.y =
          this.radius;


        if (
          this.velocity.y <
          0
        ) {

          this.velocity.y *=
            -.28;

        }


        this.velocity.x *=
          .986;

        this.velocity.z *=
          .986;

      }



      /* DRAG */

      this.velocity.multiplyScalar(
        .998
      );



      /* SIDELINES */

      if (
        ball.position.x <
        -53.6
      ) {

        ball.position.x =
          -53.6;

        this.velocity.x *=
          -.6;

      }


      if (
        ball.position.x >
        53.6
      ) {

        ball.position.x =
          53.6;

        this.velocity.x *=
          -.6;

      }



      /* NORTH GOAL */

      if (
        ball.position.z <
        -34
      ) {

        if (

          Math.abs(
            ball.position.x
          ) < 3.4

          &&

          ball.position.y <
          2.25

        ) {

          if (
            ball.position.z <
            -35.3
          ) {

            scoreGoal(
              "away"
            );

          }

        }

        else {

          ball.position.z =
            -33.6;

          this.velocity.z *=
            -.6;

        }

      }



      /* SOUTH GOAL */

      if (
        ball.position.z >
        34
      ) {

        if (

          Math.abs(
            ball.position.x
          ) < 3.4

          &&

          ball.position.y <
          2.25

        ) {

          if (
            ball.position.z >
            35.3
          ) {

            scoreGoal(
              "home"
            );

          }

        }

        else {

          ball.position.z =
            33.6;

          this.velocity.z *=
            -.6;

        }

      }



      /* BALL ROTATION */

      ball.rotation.z +=
        this.velocity.x *
        dt *
        2;

      ball.rotation.x -=
        this.velocity.z *
        dt *
        2;

    }

  }
);



/* =========================================
   GOALS
========================================= */

AFRAME.registerComponent(
  "goal",
  {

    init: function() {

      const goal =
        this.el;

      const width =
        7.2;

      const height =
        2.3;

      const depth =
        2.2;


      function bar(
        x,
        y,
        z,
        w,
        h,
        d,
        color
      ) {

        const el =
          document.createElement(
            "a-box"
          );


        el.setAttribute(
          "position",
          x + " " +
          y + " " +
          z
        );


        el.setAttribute(
          "width",
          w
        );


        el.setAttribute(
          "height",
          h
        );


        el.setAttribute(
          "depth",
          d
        );


        el.setAttribute(
          "color",
          color ||
          "#ffffff"
        );


        goal.appendChild(
          el
        );

      }


      /* POSTS */

      bar(
        -width / 2,
        height / 2,
        0,
        .16,
        height,
        .16
      );


      bar(
        width / 2,
        height / 2,
        0,
        .16,
        height,
        .16
      );


      /* CROSSBAR */

      bar(
        0,
        height,
        0,
        width,
        .16,
        .16
      );


      /* BACK */

      bar(
        0,
        height,
        depth,
        width,
        .10,
        .10
      );


      bar(
        -width / 2,
        height / 2,
        depth,
        .10,
        height,
        .10
      );


      bar(
        width / 2,
        height / 2,
        depth,
        .10,
        height,
        .10
      );


      /* NET */

      for (
        let x =
        -width / 2;

        x <=
        width / 2;

        x +=
        .45
      ) {

        bar(
          x,
          height / 2,
          depth,
          .02,
          height,
          .02,
          "#dddddd"
        );

      }


      for (
        let y =
        .2;

        y <=
        height;

        y +=
        .35
      ) {

        bar(
          0,
          y,
          depth,
          width,
          .02,
          .02,
          "#dddddd"
        );

      }

    }

  }
);

/* =========================================
   STADIUM
========================================= */

AFRAME.registerComponent(
  "stadium-maker",
  {

    init: function() {

      const stadium =
        this.el;


      function block(
        x,
        y,
        z,
        width,
        height,
        depth,
        color
      ) {

        const b =
          document.createElement(
            "a-box"
          );


        b.setAttribute(
          "position",
          x +
          " " +
          y +
          " " +
          z
        );


        b.setAttribute(
          "width",
          width
        );


        b.setAttribute(
          "height",
          height
        );


        b.setAttribute(
          "depth",
          depth
        );


        b.setAttribute(
          "color",
          color
        );


        stadium.appendChild(
          b
        );

      }



      /* STANDS */

      for (
        let tier = 0;
        tier < 18;
        tier++
      ) {

        const y =
          1 +
          tier *
          .65;


        const expand =
          tier *
          1.25;


        const purple =
          tier % 2 === 0
          ?
          "#55298d"
          :
          "#6a3cab";


        block(
          0,
          y,
          -39 - expand,
          125 +
          expand * 2,
          .62,
          2.2,
          purple
        );


        block(
          0,
          y,
          39 + expand,
          125 +
          expand * 2,
          .62,
          2.2,
          purple
        );


        block(
          -58 - expand,
          y,
          0,
          2.2,
          .62,
          82 +
          expand * 2,
          purple
        );


        block(
          58 + expand,
          y,
          0,
          2.2,
          .62,
          82 +
          expand * 2,
          purple
        );

      }



      /* WHITE LED STRIPS */

      for (
        let level = 0;
        level < 4;
        level++
      ) {

        const y =
          4 +
          level *
          4.5;


        block(
          0,
          y,
          -49 -
          level * 4,
          145,
          .22,
          .55,
          "#e9e6ff"
        );


        block(
          0,
          y,
          49 +
          level * 4,
          145,
          .22,
          .55,
          "#e9e6ff"
        );

      }



      /* ROOF */

      block(
        0,
        26,
        -67,
        165,
        1.5,
        18,
        "#171724"
      );


      block(
        0,
        26,
        67,
        165,
        1.5,
        18,
        "#171724"
      );


      block(
        -80,
        26,
        0,
        18,
        1.5,
        120,
        "#171724"
      );


      block(
        80,
        26,
        0,
        18,
        1.5,
        120,
        "#171724"
      );

    }

  }
);

/* =========================================
   WEATHER
========================================= */

function clearWeather() {

  const weather =
    document.getElementById(
      "weather"
    );


  while (
    weather.firstChild
  ) {

    weather.removeChild(
      weather.firstChild
    );

  }

}


function createRain() {

  clearWeather();


  const weather =
    document.getElementById(
      "weather"
    );


  for (
    let i = 0;
    i < 180;
    i++
  ) {

    const drop =
      document.createElement(
        "a-box"
      );


    drop.setAttribute(
      "width",
      ".012"
    );


    drop.setAttribute(
      "height",
      ".38"
    );


    drop.setAttribute(
      "depth",
      ".012"
    );


    drop.setAttribute(
      "color",
      "#8dbbff"
    );


    drop.setAttribute(
      "position",

      (
        Math.random() *
        18 - 9
      )

      +

      " "

      +

      (
        Math.random() *
        22
      )

      +

      " "

      +

      (
        Math.random() *
        18 - 9
      )
    );


    drop.setAttribute(
      "weather-particle",
      "type: rain"
    );


    weather.appendChild(
      drop
    );

  }

}


function createSnow() {

  clearWeather();


  const weather =
    document.getElementById(
      "weather"
    );


  for (
    let i = 0;
    i < 130;
    i++
  ) {

    const snow =
      document.createElement(
        "a-sphere"
      );


    snow.setAttribute(
      "radius",
      ".045"
    );


    snow.setAttribute(
      "color",
      "#ffffff"
    );


    snow.setAttribute(
      "position",

      (
        Math.random() *
        18 - 9
      )

      +

      " "

      +

      (
        Math.random() *
        22
      )

      +

      " "

      +

      (
        Math.random() *
        18 - 9
      )
    );


    snow.setAttribute(
      "weather-particle",
      "type: snow"
    );


    weather.appendChild(
      snow
    );

  }

}

/* =========================================
   INITIALIZE GAME
========================================= */

const scene =
  document.getElementById(
    "scene"
  );


scene.addEventListener(
  "loaded",

  function() {


    createFieldLines();

    createFloodlights();


    lobbyCode =
      generateLobbyCode();


    updateLobbyCode();


    const startScreen =
      document.getElementById(
        "startScreen"
      );


    const rig =
      document.getElementById(
        "rig"
      );


    /* HOME */

    document
      .getElementById(
        "homeButton"
      )
      .addEventListener(
        "click",

        function() {

          startScreen.style.display =
            "none";


          rig.setAttribute(
            "position",
            "-10 1.6 22"
          );

        }
      );


    /* AWAY */

    document
      .getElementById(
        "awayButton"
      )
      .addEventListener(
        "click",

        function() {

          startScreen.style.display =
            "none";


          rig.setAttribute(
            "position",
            "10 1.6 -22"
          );


          rig.setAttribute(
            "rotation",
            "0 180 0"
          );

        }
      );


    /* NEW LOBBY CODE */

    document
      .getElementById(
        "newCodeButton"
      )
      .addEventListener(
        "click",

        function() {

          lobbyCode =
            generateLobbyCode();


          updateLobbyCode();

        }
      );


    /* TIME BUTTONS */

    document
      .getElementById(
        "dayButton"
      )
      .addEventListener(
        "click",
        setDay
      );


    document
      .getElementById(
        "sunsetButton"
      )
      .addEventListener(
        "click",
        setSunset
      );


    document
      .getElementById(
        "nightButton"
      )
      .addEventListener(
        "click",
        setNight
      );


    /* WEATHER BUTTONS */

    document
      .getElementById(
        "normalButton"
      )
      .addEventListener(
        "click",
        clearWeather
      );


    document
      .getElementById(
        "rainButton"
      )
      .addEventListener(
        "click",
        createRain
      );


    document
      .getElementById(
        "snowButton"
      )
      .addEventListener(
        "click",
        createSnow
      );


    /* DEFAULT */

    setNight();


  }

);

</script>
