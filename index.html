    /* =========================
       FALSE 9 LOADING SCREEN
    ========================== */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at center, #242424 0%, #090909 55%, #000 100%);

      color: white;
    }

    #title {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-bottom: 15px;
      text-shadow: 0 0 30px rgba(255,255,255,.25);
    }

    #subtitle {
      font-size: 18px;
      letter-spacing: 4px;
      opacity: .65;
      margin-bottom: 45px;
    }

    #teamButtons {
      display: flex;
      gap: 30px;
    }

    .teamButton {
      width: 280px;
      height: 180px;
      border: 3px solid white;
      background: rgba(20,20,20,.9);
      color: white;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .teamButton:hover {
      transform: scale(1.05);
      background: white;
      color: black;
    }

    #homeButton {
      border-color: #ff3333;
    }

    #awayButton {
      border-color: #3388ff;
    }

    #hint {

      opacity: .5;

  </style>

  <script>

    /* =========================
       GAME VARIABLES
    ========================== */

    let homeScore = 0;
    let awayScore = 0;

    let selectedTeam = null;



    /* =========================
       TEAM SELECTION
    ========================== */

    function chooseTeam(team) {

      selectedTeam = team;

      document
        .getElementById("loadingScreen")
        .style.display = "none";


      const rig =
        document.getElementById("playerRig");


      /*
        HOME SPAWNS ON SOUTH SIDE

        AWAY SPAWNS ON NORTH SIDE
      */

      if (team === "home") {

        rig.setAttribute(
          "position",
          "0 1.65 28"
        );

      }


      if (team === "away") {

        rig.setAttribute(
          "position",
          "0 1.65 -28"
        );

      }

    }



    /* =========================
       FOOT CONTROLLER
    ========================== */

    AFRAME.registerComponent(
      "foot-controller",
      {

        schema: {

          controller: {
            type: "selector"
          },

          side: {
            type: "string"
          }

        },


        init: function () {

          this.target =
            new THREE.Vector3();

          this.previous =
            new THREE.Vector3();

          this.velocity =
            new THREE.Vector3();

        },


        tick: function (
          time,
          delta
        ) {

          if (
            !this.data.controller
          ) return;


          const controller =
            this.data.controller.object3D;


          if (
            !controller.visible
          ) return;


          controller.getWorldPosition(
            this.target
          );


          /*
            Move the visual foot lower than
            the controller so it feels more
            like a foot.
          */

          this.target.y -= 1.0;


          /*
            Move left/right slightly
          */

          if (
            this.data.side === "left"
          ) {

            this.target.x -= 0.18;

          } else {

            this.target.x += 0.18;

          }


          /*
            Smooth movement
          */

          this.el.object3D.position.lerp(
            this.target,
            0.35
          );


          /*
            Face direction based on
            controller rotation
          */

          this.el.object3D.quaternion.copy(
            controller.quaternion
          );


        }

      }
    );



    /* =========================
       BALL PHYSICS
    ========================== */

    AFRAME.registerComponent(
      "ball-physics",
      {

        init: function () {

          this.velocity =
            new THREE.Vector3();

          this.ballRadius = 0.7;

          this.lastKick = 0;

          this.ball =
            this.el.object3D;

        },


        tick: function (
          time,
          delta
        ) {

          if (
            !delta
          ) return;


          const dt =
            Math.min(
              delta / 1000,
              0.05
            );


          /*
            Apply movement
          */

          this.ball.position.add(
            this.velocity
              .clone()
              .multiplyScalar(dt)
          );


          /*
            Slow ball down
          */

          this.velocity.multiplyScalar(
            0.985
          );


          /*
            Stop tiny movement
          */

          if (
            this.velocity.length() < 0.03
          ) {

            this.velocity.set(
              0,
              0,
              0
            );

          }


          /*
            Keep ball on grass
          */

          if (
            this.ball.position.y <
            this.ballRadius
          ) {

            this.ball.position.y =
              this.ballRadius;

          }


          /*
            Check both feet
          */

          this.checkFoot(
            "leftFoot",
            time
          );

          this.checkFoot(
            "rightFoot",
            time
          );


          /*
            Keep ball inside field sides
          */

          if (
            this.ball.position.x >
            34.2
          ) {

            this.ball.position.x =
              34.2;

            this.velocity.x *= -0.7;

          }


          if (
            this.ball.position.x <
            -34.2
          ) {

            this.ball.position.x =
              -34.2;

            this.velocity.x *= -0.7;

          }


          /*
            GOAL DETECTION
          */

          this.checkGoals();

        },


        checkFoot: function (
          footID,
          time
        ) {

          const foot =
            document.getElementById(
              footID
            );


          if (
            !foot
          ) return;


          const footPos =
            new THREE.Vector3();


          foot.object3D.getWorldPosition(
            footPos
          );


          const ballPos =
            this.ball.position;


          const distance =
            footPos.distanceTo(
              ballPos
            );


          /*
            Kick range
          */

          if (
            distance < 1.25
          ) {


            /*
              Prevent a million kicks
              every frame
            */

            if (
              time -
              this.lastKick <
              180
            ) return;


            this.lastKick =
              time;


            /*
              Direction from foot
              toward ball
            */

            const direction =
              new THREE.Vector3();

            direction.subVectors(
              ballPos,
              footPos
            );


            /*
              Don't allow vertical
              kicking direction
              to dominate
            */

            direction.y = 0;


            if (
              direction.length() <
              0.1
            ) return;


            direction.normalize();


            /*
              KICK!

              Lower number =
              slower ball
            */

            this.velocity.copy(
              direction.multiplyScalar(
                7
              )
            );


            /*
              Slight bounce
            */

            this.ball.position.y =
              this.ballRadius;

          }

        },


        checkGoals: function () {

          const p =
            this.ball.position;


          /*
            NORTH GOAL

            HOME SCORES
            when ball enters north goal
          */

          if (
            p.z < -52.7 &&
            p.z > -56.5 &&
            Math.abs(p.x) < 3.8
          ) {

            homeScore++;

            updateScoreboard();

            resetBall();

          }


          /*
            SOUTH GOAL

            AWAY SCORES
            when ball enters south goal
          */

          if (
            p.z > 52.7 &&
            p.z < 56.5 &&
            Math.abs(p.x) < 3.8
          ) {

            awayScore++;

            updateScoreboard();

            resetBall();

          }


          /*
            Bounce from goal line
            if outside actual goal
          */

          if (
            p.z < -52.5 &&
            Math.abs(p.x) >= 3.8
          ) {

            p.z =
              -52.3;

            this.velocity.z *=
              -0.7;

          }


          if (
            p.z > 52.5 &&
            Math.abs(p.x) >= 3.8
          ) {

            p.z =
              52.3;

            this.velocity.z *=
              -0.7;

          }

        }

      }
    );



    /* =========================
       RESET BALL
    ========================== */

    function resetBall() {

      const ball =
        document.getElementById(
          "ball"
        );


      ball.setAttribute(
        "position",
        "0 0.7 0"
      );


      const physics =
        ball.components[
          "ball-physics"
        ];


      if (
        physics
      ) {

        physics.velocity.set(
          0,
          0,
          0
        );

      }

    }



    /* =========================
       UPDATE SCOREBOARDS
    ========================== */

    function updateScoreboard() {

      const scoreText =
        "HOME  " +
        homeScore +
        "     " +
        awayScore +
        "  AWAY";


      document
        .getElementById(
          "northScoreboard"
        )
        .setAttribute(
          "value",
          scoreText
        );


      document
        .getElementById(
          "southScoreboard"
        )
        .setAttribute(
          "value",
          scoreText
        );

    }

  </script>

</body>
