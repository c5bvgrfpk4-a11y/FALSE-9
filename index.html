<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
  }

  /* =========================
     FALSE 9 LOADING SCREEN
  ========================== */

  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, #151515 0%, #050505 70%);
    color: white;
  }

  #loadingScreen h1 {
    font-size: 72px;
    margin: 0;
    letter-spacing: 8px;
  }

  #loadingScreen p {
    opacity: .7;
    font-size: 18px;
    margin-bottom: 35px;
  }

  #teamButtons {
    display: flex;
    gap: 25px;
  }

  .teamButton {
    width: 220px;
    height: 150px;
    border: 3px solid white;
    background: #111;
    color: white;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 15px;
  }

  #homeButton {
    border-color: #e53935;
  }

  #awayButton {
    border-color: #2196f3;
  }

  .teamButton:active {
    transform: scale(.96);
  }
</style>
</head>

<body>

<!-- =========================
     TEAM SELECTION SCREEN
========================== -->

<div id="loadingScreen">

  <h1>FALSE 9</h1>

  <p>CHOOSE YOUR TEAM</p>

  <div id="teamButtons">

    <button
      class="teamButton"
      id="homeButton"
      onclick="chooseTeam('home')">

      HOME

    </button>

    <button
      class="teamButton"
      id="awayButton"
      onclick="chooseTeam('away')">

      AWAY

    </button>

  </div>

</div>


<!-- =========================
     A-FRAME VR SCENE

     IMPORTANT:
     vr-mode-ui enabled means
     the VR goggles button
     should appear in Quest Browser.
========================== -->

<a-scene
  id="scene"

  vr-mode-ui="enabled: true"

  renderer="
    antialias: true;
    colorManagement: true;
    physicallyCorrectLights: true;
  "

  background="color: #87b8df"

  loading-screen="enabled: false"

  cursor="rayOrigin: mouse"

  game-world>


  <!-- =========================
       LIGHTING
  ========================== -->

  <a-entity
    light="
      type: directional;
      intensity: 2.2;
      castShadow: true
    "
    position="-30 50 20">
  </a-entity>

  <a-entity
    light="
      type: ambient;
      intensity: 1.2
    ">
  </a-entity>


  <!-- =========================
       CAMERA RIG

       HOME SPAWNS ON ONE SIDE
       AWAY SPAWNS ON OTHER SIDE
  ========================== -->

  <a-entity
    id="rig"
    position="0 1.6 25">

    <a-camera
      id="camera"
      position="0 0 0"
      look-controls>

    </a-camera>


    <!-- LEFT CONTROLLER -->

    <a-entity
      id="leftController"

      laser-controls="hand: left"

      foot-controller="
        foot: left;
        controller: left;
      ">

      <a-entity
        id="leftFoot"
        position="0 -1.15 -0.25">

        <!-- SOCK -->

        <a-cylinder
          color="#111111"
          radius="0.11"
          height="0.42"
          position="0 0.28 0"
          rotation="90 0 0">
        </a-cylinder>


        <!-- RED CLEAT BODY -->

        <a-box
          color="#e31919"
          width="0.28"
          height="0.18"
          depth="0.62"
          position="0 0 0"
          bevelled-box>
        </a-box>


        <!-- TOE -->

        <a-sphere
          color="#f21b1b"
          radius="0.15"
          scale="1 .65 1.35"
          position="0 0 -0.25">
        </a-sphere>


        <!-- HEEL -->

        <a-box
          color="#c91010"
          width="0.28"
          height="0.16"
          depth="0.18"
          position="0 0 0.28">
        </a-box>


        <!-- BLACK SOLE -->

        <a-box
          color="#111111"
          width="0.30"
          height="0.07"
          depth="0.64"
          position="0 -0.12 0">
        </a-box>


        <!-- LACES -->

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 -0.08">
        </a-box>

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 0.03">
        </a-box>

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 0.14">
        </a-box>

      </a-entity>

    </a-entity>


    <!-- RIGHT CONTROLLER -->

    <a-entity
      id="rightController"

      laser-controls="hand: right"

      foot-controller="
        foot: right;
        controller: right;
      ">

      <a-entity
        id="rightFoot"
        position="0 -1.15 -0.25">

        <!-- SOCK -->

        <a-cylinder
          color="#111111"
          radius="0.11"
          height="0.42"
          position="0 0.28 0"
          rotation="90 0 0">
        </a-cylinder>


        <!-- RED CLEAT BODY -->

        <a-box
          color="#e31919"
          width="0.28"
          height="0.18"
          depth="0.62"
          position="0 0 0">
        </a-box>


        <!-- TOE -->

        <a-sphere
          color="#f21b1b"
          radius="0.15"
          scale="1 .65 1.35"
          position="0 0 -0.25">
        </a-sphere>


        <!-- HEEL -->

        <a-box
          color="#c91010"
          width="0.28"
          height="0.16"
          depth="0.18"
          position="0 0 0.28">
        </a-box>


        <!-- BLACK SOLE -->

        <a-box
          color="#111111"
          width="0.30"
          height="0.07"
          depth="0.64"
          position="0 -0.12 0">
        </a-box>


        <!-- LACES -->

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 -0.08">
        </a-box>

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 0.03">
        </a-box>

        <a-box
          color="#ffffff"
          width="0.17"
          height="0.025"
          depth="0.035"
          position="0 0.105 0.14">
        </a-box>

      </a-entity>

    </a-entity>

  </a-entity>


  <!-- =========================
       GRASS FIELD

       LARGE 3X STYLE FIELD
  ========================== -->

  <a-plane
    id="pitch"
    rotation="-90 0 0"
    width="108"
    height="68"
    position="0 0 0"
    color="#2f7d32">

  </a-plane>


  <!-- GRASS STRIPES -->

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="8"
    position="0 0.005 -25"
    color="#347f35">
  </a-plane>

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="8"
    position="0 0.005 -9"
    color="#347f35">
  </a-plane>

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="8"
    position="0 0.005 9"
    color="#347f35">
  </a-plane>

  <a-plane
    rotation="-90 0 0"
    width="108"
    height="8"
    position="0 0.005 25"
    color="#347f35">
  </a-plane>


  <!-- =========================
       FIELD LINES
  ========================== -->

  <a-entity id="fieldLines"></a-entity>


  <!-- =========================
       BALL
  ========================== -->

  <a-sphere
    id="ball"

    position="0 0.42 0"

    radius="0.42"

    color="#ffffff"

    ball-physics>

  </a-sphere>


  <!-- BALL PATTERN -->

  <a-sphere
    position="0 0.42 0"
    radius="0.425"
    material="
      color: #ffffff;
      roughness: .7;
    "
    visible="false">
  </a-sphere>


  <!-- =========================
       GOALS
  ========================== -->

  <a-entity
    id="homeGoal"
    position="0 0 -34">

    <a-entity goal="side: home"></a-entity>

  </a-entity>


  <a-entity
    id="awayGoal"
    position="0 0 34"
    rotation="0 180 0">

    <a-entity goal="side: away"></a-entity>

  </a-entity>


  <!-- =========================
       STADIUM
  ========================== -->

  <a-entity id="stadium"></a-entity>


  <!-- =========================
       SCOREBOARDS
  ========================== -->

  <!-- NORTH -->

  <a-entity
    position="0 18 -47"
    rotation="0 0 0">

    <a-box
      width="18"
      height="7"
      depth=".6"
      color="#111">
    </a-box>

    <a-text
      id="northScore"
      value="HOME  0     -     0  AWAY"
      align="center"
      width="16"
      color="#ffffff"
      position="0 0 .32">
    </a-text>

  </a-entity>


  <!-- SOUTH / FACES CENTER -->

  <a-entity
    position="0 18 47"
    rotation="0 180 0">

    <a-box
      width="18"
      height="7"
      depth=".6"
      color="#111">
    </a-box>

    <a-text
      id="southScore"
      value="HOME  0     -     0  AWAY"
      align="center"
      width="16"
      color="#ffffff"
      position="0 0 .32">
    </a-text>

  </a-entity>


  <!-- SKY -->

  <a-sky
    color="#9cccf0">
  </a-sky>


</a-scene>


<script>

/* =====================================================
   FALSE 9
   MAIN GAME CODE
===================================================== */


/* =====================================================
   BEVELLED BOX
===================================================== */

AFRAME.registerComponent("bevelled-box", {

  init: function () {

    const mesh = this.el.getObject3D("mesh");

  }

});


/* =====================================================
   TEAM
===================================================== */

let selectedTeam = null;

function chooseTeam(team) {

  selectedTeam = team;

  document.getElementById("loadingScreen").style.display = "none";

  const rig = document.getElementById("rig");

  if (team === "home") {

    rig.setAttribute(
      "position",
      "-10 1.6 22"
    );

  } else {

    rig.setAttribute(
      "position",
      "10 1.6 -22"
    );

  }

}


/* =====================================================
   SCORE
===================================================== */

let homeScore = 0;
let awayScore = 0;

function updateScore() {

  const score =
    "HOME  " +
    homeScore +
    "     -     " +
    awayScore +
    "  AWAY";

  document
    .getElementById("northScore")
    .setAttribute("value", score);

  document
    .getElementById("southScore")
    .setAttribute("value", score);

}


function resetBall() {

  const ball =
    document.getElementById("ball");

  ball.object3D.position.set(
    0,
    0.42,
    0
  );

  const physics =
    ball.components["ball-physics"];

  if (physics) {

    physics.velocity.set(
      0,
      0,
      0
    );

  }

}


function scoreGoal(team) {

  if (team === "home") {

    homeScore++;

  } else {

    awayScore++;

  }

  updateScore();

  setTimeout(
    resetBall,
    800
  );

}


/* =====================================================
   FIELD LINES
===================================================== */

window.addEventListener(
  "load",
  () => {

    const container =
      document.getElementById("fieldLines");


    function line(
      width,
      depth,
      x,
      z
    ) {

      const el =
        document.createElement(
          "a-box"
        );

      el.setAttribute(
        "width",
        width
      );

      el.setAttribute(
        "height",
        "0.025"
      );

      el.setAttribute(
        "depth",
        depth
      );

      el.setAttribute(
        "color",
        "#ffffff"
      );

      el.setAttribute(
        "position",
        `${x} 0.02 ${z}`
      );

      container.appendChild(el);

    }


    /* OUTSIDE BOUNDARY */

    line(
      108,
      .16,
      0,
      -34
    );

    line(
      108,
      .16,
      0,
      34
    );

    line(
      .16,
      68,
      -54,
      0
    );

    line(
      .16,
      68,
      54,
      0
    );


    /* HALF WAY LINE */

    line(
      108,
      .12,
      0,
      0
    );


    /* CENTER CIRCLE */

    const circle =
      document.createElement(
        "a-ring"
      );

    circle.setAttribute(
      "rotation",
      "-90 0 0"
    );

    circle.setAttribute(
      "radius-inner",
      "9.05"
    );

    circle.setAttribute(
      "radius-outer",
      "9.15"
    );

    circle.setAttribute(
      "color",
      "#ffffff"
    );

    circle.setAttribute(
      "position",
      "0 0.025 0"
    );

    container.appendChild(circle);


    /* CENTER SPOT */

    const centerSpot =
      document.createElement(
        "a-cylinder"
      );

    centerSpot.setAttribute(
      "radius",
      ".12"
    );

    centerSpot.setAttribute(
      "height",
      ".03"
    );

    centerSpot.setAttribute(
      "color",
      "#ffffff"
    );

    centerSpot.setAttribute(
      "position",
      "0 .025 0"
    );

    container.appendChild(
      centerSpot
    );


    /* PENALTY AREAS */

    createBoxLines(
      -34,
      16.5,
      40.3
    );

    createBoxLines(
      34,
      16.5,
      40.3
    );


    /* SMALL BOXES */

    createBoxLines(
      -34,
      5.5,
      18.3
    );

    createBoxLines(
      34,
      5.5,
      18.3
    );


    /* PENALTY SPOTS */

    spot(-23);
    spot(23);


    function spot(z) {

      const s =
        document.createElement(
          "a-cylinder"
        );

      s.setAttribute(
        "radius",
        ".13"
      );

      s.setAttribute(
        "height",
        ".03"
      );

      s.setAttribute(
        "color",
        "#ffffff"
      );

      s.setAttribute(
        "position",
        `0 .025 ${z}`
      );

      container.appendChild(s);

    }


    function createBoxLines(
      goalZ,
      depth,
      width
    ) {

      const direction =
        goalZ < 0
          ? 1
          : -1;

      const frontZ =
        goalZ +
        depth * direction;


      line(
        width,
        .12,
        0,
        frontZ
      );

      line(
        .12,
        depth,
        -width / 2,
        (goalZ + frontZ) / 2
      );

      line(
        .12,
        depth,
        width / 2,
        (goalZ + frontZ) / 2
      );

    }

  }
);


/* =====================================================
   STADIUM
===================================================== */

AFRAME.registerComponent(
  "game-world",
  {

    init: function () {

      const stadium =
        document.getElementById(
          "stadium"
        );


      function block(
        x,
        y,
        z,
        w,
        h,
        d,
        color
      ) {

        const b =
          document.createElement(
            "a-box"
          );

        b.setAttribute(
          "position",
          `${x} ${y} ${z}`
        );

        b.setAttribute(
          "width",
          w
        );

        b.setAttribute(
          "height",
          h
        );

        b.setAttribute(
          "depth",
          d
        );

        b.setAttribute(
          "color",
          color
        );

        stadium.appendChild(b);

      }


      /*
        CONTINUOUS STANDS

        These go directly around
        the field with no giant
        empty gaps.
      */


      for (
        let tier = 0;
        tier < 9;
        tier++
      ) {

        const y =
          1.2 +
          tier * 1.15;

        const offset =
          tier * 1.7;


        /* LONG SIDES */

        block(
          0,
          y,
          -39 - offset,
          125 + tier * 4,
          1.1,
          4.5,
          tier % 2
            ? "#54268f"
            : "#6838aa"
        );

        block(
          0,
          y,
          39 + offset,
          125 + tier * 4,
          1.1,
          4.5,
          tier % 2
            ? "#54268f"
            : "#6838aa"
        );


        /* END SIDES */

        block(
          -59 - offset,
          y,
          0,
          4.5,
          1.1,
          82 + tier * 4,
          tier % 2
            ? "#54268f"
            : "#6838aa"
        );

        block(
          59 + offset,
          y,
          0,
          4.5,
          1.1,
          82 + tier * 4,
          tier % 2
            ? "#54268f"
            : "#6838aa"
        );

      }


      /*
        WALKWAY RINGS
      */

      block(
        0,
        10,
        -52,
        145,
        1,
        3,
        "#222"
      );

      block(
        0,
        10,
        52,
        145,
        1,
        3,
        "#222"
      );


      /*
        STADIUM ROOF

        Open in the middle
        like a modern enclosed
        stadium.
      */

      const roofHeight = 27;


      block(
        0,
        roofHeight,
        -64,
        155,
        2,
        20,
        "#191919"
      );

      block(
        0,
        roofHeight,
        64,
        155,
        2,
        20,
        "#191919"
      );

      block(
        -73,
        roofHeight,
        0,
        20,
        2,
        110,
        "#191919"
      );

      block(
        73,
        roofHeight,
        0,
        20,
        2,
        110,
        "#191919"
      );


      /*
        ROOF LIGHT STRIPS
      */

      block(
        0,
        25.5,
        -53,
        130,
        .5,
        1,
        "#eeeeff"
      );

      block(
        0,
        25.5,
        53,
        130,
        .5,
        1,
        "#eeeeff"
      );


    }

  }
);


/* =====================================================
   GOALS
===================================================== */

AFRAME.registerComponent(
  "goal",
  {

    schema: {

      side: {
        default: "home"
      }

    },


    init: function () {

      const goal =
        this.el;


      const width =
        7.2;

      const height =
        2.3;

      const depth =
        2.2;

      const poleRadius =
        .09;


      function pole(
        x,
        y,
        z,
        w,
        h,
        d
      ) {

        const p =
          document.createElement(
            "a-box"
          );

        p.setAttribute(
          "color",
          "#ffffff"
        );

        p.setAttribute(
          "width",
          w
        );

        p.setAttribute(
          "height",
          h
        );

        p.setAttribute(
          "depth",
          d
        );

        p.setAttribute(
          "position",
          `${x} ${y} ${z}`
        );

        goal.appendChild(p);

      }


      /*
        CONNECTED GOAL FRAME
      */


      /* POSTS */

      pole(
        -width / 2,
        height / 2,
        0,
        poleRadius * 2,
        height,
        poleRadius * 2
      );

      pole(
        width / 2,
        height / 2,
        0,
        poleRadius * 2,
        height,
        poleRadius * 2
      );


      /* CROSSBAR */

      pole(
        0,
        height,
        0,
        width,
        poleRadius * 2,
        poleRadius * 2
      );


      /* BACK TOP */

      pole(
        0,
        height,
        depth,
        width,
        poleRadius * 2,
        poleRadius * 2
      );


      /* BACK POSTS */

      pole(
        -width / 2,
        height / 2,
        depth,
        poleRadius * 2,
        height,
        poleRadius * 2
      );

      pole(
        width / 2,
        height / 2,
        depth,
        poleRadius * 2,
        height,
        poleRadius * 2
      );


      /* TOP SIDE CONNECTORS */

      pole(
        -width / 2,
        height,
        depth / 2,
        poleRadius * 2,
        poleRadius * 2,
        depth
      );

      pole(
        width / 2,
        height,
        depth / 2,
        poleRadius * 2,
        poleRadius * 2,
        depth
      );


      /*
        NET

        Visible grid.
      */

      const net =
        document.createElement(
          "a-entity"
        );

      goal.appendChild(net);


      function netLine(
        x,
        y,
        z,
        w,
        h,
        d
      ) {

        const n =
          document.createElement(
            "a-box"
          );

        n.setAttribute(
          "color",
          "#eeeeee"
        );

        n.setAttribute(
          "opacity",
          ".45"
        );

        n.setAttribute(
          "transparent",
          "true"
        );

        n.setAttribute(
          "width",
          w
        );

        n.setAttribute(
          "height",
          h
        );

        n.setAttribute(
          "depth",
          d
        );

        n.setAttribute(
          "position",
          `${x} ${y} ${z}`
        );

        net.appendChild(n);

      }


      /*
        BACK NET VERTICALS
      */

      for (
        let x =
          -width / 2;
        x <= width / 2;
        x += .6
      ) {

        netLine(
          x,
          height / 2,
          depth,
          .025,
          height,
          .025
        );

      }


      /*
        BACK NET HORIZONTALS
      */

      for (
        let y = 0;
        y <= height;
        y += .35
      ) {

        netLine(
          0,
          y,
          depth,
          width,
          .025,
          .025
        );

      }


      /*
        SIDE NETS
      */

      for (
        let z = 0;
        z <= depth;
        z += .45
      ) {

        netLine(
          -width / 2,
          height / 2,
          z,
          .025,
          height,
          .025
        );

        netLine(
          width / 2,
          height / 2,
          z,
          .025,
          height,
          .025
        );

      }

    }

  }
);


/* =====================================================
   FOOT CONTROLLERS
===================================================== */

AFRAME.registerComponent(
  "foot-controller",
  {

    schema: {

      foot: {
        default: "left"
      },

      controller: {
        default: "left"
      }

    },


    init: function () {

      this.lastWorldPosition =
        new THREE.Vector3();

      this.velocity =
        new THREE.Vector3();

    },


    tick: function (
      time,
      delta
    ) {

      const foot =
        document.getElementById(
          this.data.foot +
          "Foot"
        );

      const controller =
        this.el.object3D;


      /*
        Controller position
        becomes foot position.

        We project the foot
        downward so your hands
        control feet on the ground.
      */


      const target =
        controller.position.clone();


      /*
        Left/right separation
      */

      if (
        this.data.foot === "left"
      ) {

        target.x -= .18;

      } else {

        target.x += .18;

      }


      /*
        FOOT BELOW CONTROLLER
      */

      target.y =
        -1.1;


      target.z -= .35;


      foot.object3D.position.lerp(
        target,
        .35
      );


      /*
        Foot rotation follows
        controller rotation.
      */

      foot.object3D.rotation.y =
        controller.rotation.y;


      /*
        Calculate foot speed
        for kicking.
      */

      const current =
        new THREE.Vector3();

      foot.object3D.getWorldPosition(
        current
      );

      if (delta > 0) {

        this.velocity
          .subVectors(
            current,
            this.lastWorldPosition
          )
          .multiplyScalar(
            1000 / delta
          );

      }

      this.lastWorldPosition.copy(
        current
      );

    }

  }
);


/* =====================================================
   BALL PHYSICS
===================================================== */

AFRAME.registerComponent(
  "ball-physics",
  {

    init: function () {

      this.velocity =
        new THREE.Vector3();

      this.radius =
        .42;

      this.lastKick =
        0;

    },


    tick: function (
      time,
      delta
    ) {

      const ball =
        this.el.object3D;

      const dt =
        Math.min(
          delta / 1000,
          .03
        );


      /*
        GRAVITY
      */

      this.velocity.y -=
        9.8 * dt;


      /*
        MOVE BALL
      */

      ball.position.addScaledVector(
        this.velocity,
        dt
      );


      /*
        GROUND
      */

      if (
        ball.position.y <
        this.radius
      ) {

        ball.position.y =
          this.radius;

        if (
          this.velocity.y < 0
        ) {

          this.velocity.y *=
            -.25;

        }

        /*
          Slow rolling
        */

        this.velocity.x *=
          .992;

        this.velocity.z *=
          .992;

      }


      /*
        AIR DRAG
      */

      this.velocity.multiplyScalar(
        .998
      );


      /*
        KICK DETECTION
      */

      this.checkFoot(
        "leftFoot",
        time
      );

      this.checkFoot(
        "rightFoot",
        time
      );


      /*
        FIELD WALLS
      */

      if (
        ball.position.x < -53.5
      ) {

        ball.position.x =
          -53.5;

        this.velocity.x *=
          -.65;

      }

      if (
        ball.position.x > 53.5
      ) {

        ball.position.x =
          53.5;

        this.velocity.x *=
          -.65;

      }


      /*
        GOAL / END LINE
      */

      this.goalCollision(
        ball
      );


      /*
        Rotate ball
      */

      ball.rotation.z +=
        this.velocity.x * dt * 1.5;

      ball.rotation.x -=
        this.velocity.z * dt * 1.5;

    },


    checkFoot: function (
      id,
      time
    ) {

      const foot =
        document.getElementById(
          id
        );

      if (!foot) return;


      const footPos =
        new THREE.Vector3();

      foot.object3D.getWorldPosition(
        footPos
      );


      const ballPos =
        this.el.object3D.position;


      const dx =
        ballPos.x -
        footPos.x;

      const dy =
        ballPos.y -
        footPos.y;

      const dz =
        ballPos.z -
        footPos.z;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy +
          dz * dz
        );


      if (
        distance <
        .72
      ) {

        /*
          Direction FROM FOOT
          TO BALL

          This makes the ball
          go wherever you hit
          it from.
        */

        const direction =
          new THREE.Vector3(
            dx,
            Math.max(
              .05,
              dy
            ),
            dz
          ).normalize();


        /*
          Find foot movement
        */

        const controller =
          id === "leftFoot"
            ? document.getElementById(
                "leftController"
              )
            : document.getElementById(
                "rightController"
              );


        let power = 4;


        if (controller) {

          const component =
            controller.components[
              "foot-controller"
            ];

          if (component) {

            power +=
              Math.min(
                component.velocity.length() *
                1.2,
                16
              );

          }

        }


        /*
          Kick cooldown
        */

        if (
          time -
          this.lastKick >
          120
        ) {

          this.velocity
            .copy(direction)
            .multiplyScalar(power);


          /*
            Add controller movement
          */

          if (
            controller
          ) {

            const component =
              controller.components[
                "foot-controller"
              ];

            if (
              component
            ) {

              this.velocity.addScaledVector(
                component.velocity,
                .35
              );

            }

          }


          this.lastKick =
            time;

        }

      }

    },


    goalCollision: function (
      ball
    ) {

      /*
        Goal dimensions
      */

      const goalWidth =
        7.2 / 2;

      const goalHeight =
        2.3;


      /*
        NORTH GOAL
      */

      if (
        ball.position.z <
        -34
      ) {

        if (
          Math.abs(
            ball.position.x
          ) <
          goalWidth - .25
          &&
          ball.position.y <
          goalHeight
        ) {

          if (
            ball.position.z <
            -35.5
          ) {

            scoreGoal(
              "away"
            );

          }

        } else {

          ball.position.z =
            -33.5;

          this.velocity.z *=
            -.7;

        }

      }


      /*
        SOUTH GOAL
      */

      if (
        ball.position.z >
        34
      ) {

        if (
          Math.abs(
            ball.position.x
          ) <
          goalWidth - .25
          &&
          ball.position.y <
          goalHeight
        ) {

          if (
            ball.position.z >
            35.5
          ) {

            scoreGoal(
              "home"
            );

          }

        } else {

          ball.position.z =
            33.5;

          this.velocity.z *=
            -.7;

        }

      }


      /*
        BACK OF NET
        BALL BOUNCES
      */

      if (
        ball.position.z <
        -36.2
      ) {

        ball.position.z =
          -36.2;

        this.velocity.z *=
          -.45;

      }

      if (
        ball.position.z >
        36.2
      ) {

        ball.position.z =
          36.2;

        this.velocity.z *=
          -.45;

      }

    }

  }
);
