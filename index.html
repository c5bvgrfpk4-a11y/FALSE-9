<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FALSE 9</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family: Arial, sans-serif;
}

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #181818 0%, #050505 75%);
  color: white;
}

#loadingScreen h1 {
  margin: 0;
  font-size: clamp(48px, 10vw, 80px);
  letter-spacing: 8px;
}

#loadingScreen p {
  margin: 20px 0 35px;
  opacity: .75;
  letter-spacing: 2px;
}

#teamButtons {
  display: flex;
  gap: 25px;
}

.teamButton {
  width: 220px;
  height: 150px;
  border: 3px solid white;
  border-radius: 15px;
  background: #111;
  color: white;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

#homeButton {
  border-color: #e53935;
}

#awayButton {
  border-color: #2196f3;
}
</style>
</head>

<body>

<div id="loadingScreen">
  <h1>FALSE 9</h1>
  <p>CHOOSE YOUR TEAM</p>

  <div id="teamButtons">
    <button class="teamButton" id="homeButton">HOME</button>
    <button class="teamButton" id="awayButton">AWAY</button>
  </div>
</div>


<a-scene
  id="scene"
  vr-mode-ui="enabled: true"
  loading-screen="enabled: false"
  background="color: #87b8df"
  renderer="antialias: true">

  <!-- SKY -->
  <a-sky color="#87b8df"></a-sky>

  <!-- LIGHTS -->
  <a-entity
    light="type: ambient; intensity: 1.2">
  </a-entity>

  <a-entity
    light="type: directional; intensity: 1.2"
    position="-20 30 20">
  </a-entity>


  <!-- PLAYER -->
  <a-entity id="rig" position="0 1.6 28">

    <a-camera
      id="camera"
      position="0 0 0"
      look-controls
      wasd-controls>
    </a-camera>

    <a-entity
      id="leftController"
      laser-controls="hand: left">

      <a-entity
        id="leftFoot"
        position="-0.25 -1.15 -0.6">

        <a-box
          width="0.32"
          height="0.18"
          depth="0.65"
          color="#e31919">
        </a-box>

        <a-box
          width="0.34"
          height="0.06"
          depth="0.68"
          position="0 -0.12 0"
          color="#111">
        </a-box>

      </a-entity>

    </a-entity>


    <a-entity
      id="rightController"
      laser-controls="hand: right">

      <a-entity
        id="rightFoot"
        position="0.25 -1.15 -0.6">

        <a-box
          width="0.32"
          height="0.18"
          depth="0.65"
          color="#e31919">
        </a-box>

        <a-box
          width="0.34"
          height="0.06"
          depth="0.68"
          position="0 -0.12 0"
          color="#111">
        </a-box>

      </a-entity>

    </a-entity>

  </a-entity>


  <!-- PITCH -->
  <a-plane
    rotation="-90 0 0"
    width="108"
    height="68"
    position="0 0 0"
    color="#2f7d32">
  </a-plane>

  <!-- CENTER LINE -->
  <a-box
    width="108"
    height="0.03"
    depth="0.15"
    position="0 0.02 0"
    color="white">
  </a-box>

  <!-- CENTER CIRCLE -->
  <a-ring
    rotation="-90 0 0"
    radius-inner="9"
    radius-outer="9.15"
    position="0 0.025 0"
    color="white">
  </a-ring>

  <!-- BALL -->
  <a-sphere
    id="ball"
    position="0 0.42 0"
    radius="0.42"
    color="white">
  </a-sphere>


  <!-- NORTH GOAL -->
  <a-entity id="northGoal" position="0 0 -34">

    <a-box position="-3.6 1.15 0" width="0.15" height="2.3" depth="0.15" color="white"></a-box>
    <a-box position="3.6 1.15 0" width="0.15" height="2.3" depth="0.15" color="white"></a-box>
    <a-box position="0 2.3 0" width="7.2" height="0.15" depth="0.15" color="white"></a-box>

  </a-entity>


  <!-- SOUTH GOAL -->
  <a-entity id="southGoal" position="0 0 34">

    <a-box position="-3.6 1.15 0" width="0.15" height="2.3" depth="0.15" color="white"></a-box>
    <a-box position="3.6 1.15 0" width="0.15" height="2.3" depth="0.15" color="white"></a-box>
    <a-box position="0 2.3 0" width="7.2" height="0.15" depth="0.15" color="white"></a-box>

  </a-entity>


  <!-- SIMPLE STADIUM -->
  <a-box
    position="0 4 -42"
    width="120"
    height="8"
    depth="5"
    color="#54268f">
  </a-box>

  <a-box
    position="0 4 42"
    width="120"
    height="8"
    depth="5"
    color="#54268f">
  </a-box>

  <a-box
    position="-60 4 0"
    width="5"
    height="8"
    depth="85"
    color="#54268f">
  </a-box>

  <a-box
    position="60 4 0"
    width="5"
    height="8"
    depth="85"
    color="#54268f">
  </a-box>

</a-scene>


<script>

/* ===============================
   TEAM SELECTION
================================ */

const loadingScreen =
  document.getElementById("loadingScreen");

const rig =
  document.getElementById("rig");

const camera =
  document.getElementById("camera");


document
  .getElementById("homeButton")
  .addEventListener("click", function () {

    rig.setAttribute(
      "position",
      "0 1.6 28"
    );

    rig.setAttribute(
      "rotation",
      "0 180 0"
    );

    loadingScreen.style.display =
      "none";

  });


document
  .getElementById("awayButton")
  .addEventListener("click", function () {

    rig.setAttribute(
      "position",
      "0 1.6 -28"
    );

    rig.setAttribute(
      "rotation",
      "0 0 0"
    );

    loadingScreen.style.display =
      "none";

  });


/* ===============================
   CONTROLLER FEET
================================ */

AFRAME.registerComponent(
  "foot-follow",
  {

    schema: {
      foot: {
        type: "selector"
      }
    },

    tick: function () {

      if (!this.data.foot) return;

      const controller =
        this.el.object3D;

      const foot =
        this.data.foot.object3D;

      foot.position.x =
        controller.position.x;

      foot.position.z =
        controller.position.z - 0.6;

    }

  }
);


document
  .getElementById("leftController")
  .setAttribute(
    "foot-follow",
    "foot: #leftFoot"
  );

document
  .getElementById("rightController")
  .setAttribute(
    "foot-follow",
    "foot: #rightFoot"
  );

</script>

</body>
</html>
