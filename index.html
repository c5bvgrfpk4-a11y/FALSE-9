<script>

/* =================================================
   LOBBY CODE
================================================= */

function generateLobbyCode() {

  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const letter =
    letters[
      Math.floor(
        Math.random() * letters.length
      )
    ];

  const number =
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  return letter + "-" + number;
}

let lobbyCode = generateLobbyCode();


/* =================================================
   WEATHER COMPONENT
================================================= */

AFRAME.registerComponent("weather-drop", {

  schema: {
    speed: {
      default: 12
    }
  },

  tick: function (time, delta) {

    const p =
      this.el.object3D.position;

    p.y -=
      this.data.speed *
      delta /
      1000;

    if (p.y < 0) {
      p.y = 25;
    }

  }

});


/* =================================================
   BALL PHYSICS
================================================= */

AFRAME.registerComponent("ball-physics", {

  init: function () {

    this.velocity =
      new THREE.Vector3();

    this.radius = .28;

  },

  tick: function (time, delta) {

    const dt =
      Math.min(
        delta / 1000,
        .03
      );

    const ball =
      this.el.object3D;


    /* GRAVITY */

    this.velocity.y -=
      9.8 * dt;


    /* MOVE */

    ball.position.addScaledVector(
      this.velocity,
      dt
    );


    /* GROUND */

    if (
      ball.position.y <
      this.radius
    ) {

      ball.position.y =
        this.radius;

      if (
        this.velocity.y < 0
      ) {
        this.velocity.y *= -.28;
      }

      this.velocity.x *= .987;
      this.velocity.z *= .987;

    }


    /* AIR DRAG */

    this.velocity.multiplyScalar(
      .998
    );


    /* FIELD WALLS */

    if (
      ball.position.x < -53.5
    ) {
      ball.position.x = -53.5;
      this.velocity.x *= -.65;
    }

    if (
      ball.position.x > 53.5
    ) {
      ball.position.x = 53.5;
      this.velocity.x *= -.65;
    }

    if (
      ball.position.z < -33.7
    ) {
      ball.position.z = -33.7;
      this.velocity.z *= -.65;
    }

    if (
      ball.position.z > 33.7
    ) {
      ball.position.z = 33.7;
      this.velocity.z *= -.65;
    }


    /* ROTATION */

    ball.rotation.z +=
      this.velocity.x *
      dt * 2;

    ball.rotation.x -=
      this.velocity.z *
      dt * 2;

  }

});


/* =================================================
   GOAL COMPONENT
================================================= */

AFRAME.registerComponent("goal", {

  init: function () {

    const goal = this.el;

    const width = 7.2;
    const height = 2.3;
    const depth = 2.2;


    function bar(
      x, y, z,
      w, h, d,
      color
    ) {

      const piece =
        document.createElement(
          "a-box"
        );

      piece.setAttribute(
        "position",
        x + " " +
        y + " " +
        z
      );

      piece.setAttribute(
        "width",
        w
      );

      piece.setAttribute(
        "height",
        h
      );

      piece.setAttribute(
        "depth",
        d
      );

      piece.setAttribute(
        "color",
        color || "#ffffff"
      );

      goal.appendChild(piece);

    }


    bar(
      -width / 2,
      height / 2,
      0,
      .15,
      height,
      .15
    );

    bar(
      width / 2,
      height / 2,
      0,
      .15,
      height,
      .15
    );

    bar(
      0,
      height,
      0,
      width,
      .15,
      .15
    );

    bar(
      0,
      height,
      depth,
      width,
      .10,
      .10
    );

  }

});


/* =================================================
   STADIUM
================================================= */

AFRAME.registerComponent("stadium-maker", {

  init: function () {

    const stadium =
      this.el;


    function block(
      x, y, z,
      w, h, d,
      color
    ) {

      const b =
        document.createElement(
          "a-box"
        );

      b.setAttribute(
        "position",
        x + " " +
        y + " " +
        z
      );

      b.setAttribute(
        "width",
        w
      );

      b.setAttribute(
        "height",
        h
      );

      b.setAttribute(
        "depth",
        d
      );

      b.setAttribute(
        "color",
        color
      );

      stadium.appendChild(b);

    }


    /* STANDS */

    for (
      let tier = 0;
      tier < 12;
      tier++
    ) {

      const y =
        1 + tier * .9;

      const expand =
        tier * 1.4;

      const color =
        tier % 2 === 0
          ? "#54278f"
          : "#6d42aa";


      block(
        0,
        y,
        -38 - expand,
        125 + expand * 2,
        .75,
        3,
        color
      );

      block(
        0,
        y,
        38 + expand,
        125 + expand * 2,
        .75,
        3,
        color
      );

      block(
        -58 - expand,
        y,
        0,
        3,
        .75,
        82 + expand * 2,
        color
      );

      block(
        58 + expand,
        y,
        0,
        3,
        .75,
        82 + expand * 2,
        color
      );

    }


    /* ROOF */

    block(
      0,
      25,
      -65,
      155,
      2,
      18,
      "#151520"
    );

    block(
      0,
      25,
      65,
      155,
      2,
      18,
      "#151520"
    );

  }

});


/* =================================================
   FIELD LINES
================================================= */

function createFieldLines() {

  const lines =
    document.getElementById(
      "fieldLines"
    );


  function line(
    width,
    depth,
    x,
    z
  ) {

    const el =
      document.createElement(
        "a-box"
      );

    el.setAttribute(
      "width",
      width
    );

    el.setAttribute(
      "height",
      ".025"
    );

    el.setAttribute(
      "depth",
      depth
    );

    el.setAttribute(
      "color",
      "#ffffff"
    );

    el.setAttribute(
      "position",
      x + " .02 " + z
    );

    lines.appendChild(el);

  }


  line(108, .12, 0, -34);
  line(108, .12, 0, 34);

  line(.12, 68, -54, 0);
  line(.12, 68, 54, 0);

  line(108, .10, 0, 0);


  const circle =
    document.createElement(
      "a-ring"
    );

  circle.setAttribute(
    "rotation",
    "-90 0 0"
  );

  circle.setAttribute(
    "radius-inner",
    "9.0"
  );

  circle.setAttribute(
    "radius-outer",
    "9.12"
  );

  circle.setAttribute(
    "color",
    "white"
  );

  circle.setAttribute(
    "position",
    "0 .02 0"
  );

  lines.appendChild(circle);

}


/* =================================================
   KICK SYSTEM
================================================= */

function setupKicking() {

  const ball =
    document.getElementById(
      "ball"
    );

  const leftBoot =
    document.getElementById(
      "leftBoot"
    );

  const rightBoot =
    document.getElementById(
      "rightBoot"
    );


  const ballPhysics =
    ball.components[
      "ball-physics"
    ];


  if (!ballPhysics) return;


  const ballWorld =
    new THREE.Vector3();

  const bootWorld =
    new THREE.Vector3();


  let leftLast =
    new THREE.Vector3();

  let rightLast =
    new THREE.Vector3();

  let lastTime =
    performance.now();


  function checkBoot(
    boot,
    lastPosition,
    dt
  ) {

    boot.object3D.getWorldPosition(
      bootWorld
    );

    ball.object3D.getWorldPosition(
      ballWorld
    );


    const velocity =
      bootWorld.clone()
        .sub(lastPosition)
        .multiplyScalar(
          1 / Math.max(dt, .001)
        );


    const distance =
      bootWorld.distanceTo(
        ballWorld
      );


    if (
      distance < .65 &&
      velocity.length() > .3
    ) {

      const direction =
        ballWorld.clone()
          .sub(bootWorld)
          .normalize();


      direction.add(
        velocity.clone()
          .normalize()
          .multiplyScalar(.7)
      );

      direction.normalize();


      ballPhysics.velocity.add(
        direction.multiplyScalar(
          Math.min(
            velocity.length() * .6,
            16
          )
        )
      );

      ballPhysics.velocity.y +=
        1.5;

    }


    lastPosition.copy(
      bootWorld
    );

  }


  function loop() {

    const now =
      performance.now();

    const dt =
      (now - lastTime) / 1000;

    lastTime = now;


    checkBoot(
      leftBoot,
      leftLast,
      dt
    );

    checkBoot(
      rightBoot,
      rightLast,
      dt
    );


    requestAnimationFrame(
      loop
    );

  }


  leftBoot.object3D.getWorldPosition(
    leftLast
  );

  rightBoot.object3D.getWorldPosition(
    rightLast
  );


  loop();

}


/* =================================================
   START GAME
================================================= */

window.addEventListener(
  "load",
  function () {

    const scene =
      document.getElementById(
        "scene"
      );


    scene.addEventListener(
      "loaded",
      function () {


        createFieldLines();


        /* START SCREEN */

        const startScreen =
          document.getElementById(
            "startScreen"
          );

        const rig =
          document.getElementById(
            "rig"
          );


        document
          .getElementById(
            "homeButton"
          )
          .addEventListener(
            "click",
            function () {

              rig.setAttribute(
                "position",
                "-10 1.6 22"
              );

              startScreen.style.display =
                "none";

            }
          );


        document
          .getElementById(
            "awayButton"
          )
          .addEventListener(
            "click",
            function () {

              rig.setAttribute(
                "position",
                "10 1.6 -22"
              );

              startScreen.style.display =
                "none";

            }
          );


        /* MENU */

        const menu =
          document.getElementById(
            "vrMenu"
          );


        document
          .getElementById(
            "menuButton"
          )
          .addEventListener(
            "click",
            function () {

              const current =
                menu.getAttribute(
                  "visible"
                );

              menu.setAttribute(
                "visible",
                !current
              );

            }
          );


        /* LOBBY CODE */

        const lobbyText =
          document.getElementById(
            "lobbyCodeText"
          );

        lobbyText.setAttribute(
          "value",
          lobbyCode
        );


        document
          .getElementById(
            "newCodeButton"
          )
          .addEventListener(
            "click",
            function () {

              lobbyCode =
                generateLobbyCode();

              lobbyText.setAttribute(
                "value",
                lobbyCode
              );

            }
          );


        /* TIME */

        function setSky(
          color,
          ambient,
          sun
        ) {

          document
            .getElementById(
              "sky"
            )
            .setAttribute(
              "color",
              color
            );


          document
            .getElementById(
              "ambientLight"
            )
            .setAttribute(
              "light",
              "intensity",
              ambient
            );


          document
            .getElementById(
              "sunLight"
            )
            .setAttribute(
              "light",
              "intensity",
              sun
            );

        }


        document
          .getElementById(
            "dayButton"
          )
          .addEventListener(
            "click",
            function () {
              setSky(
                "#78b9e8",
                1,
                2.5
              );
            }
          );


        document
          .getElementById(
            "sunsetButton"
          )
          .addEventListener(
            "click",
            function () {
              setSky(
                "#b45d43",
                .65,
                1.4
              );
            }
          );


        document
          .getElementById(
            "nightButton"
          )
          .addEventListener(
            "click",
            function () {
              setSky(
                "#02030a",
                .45,
                1.2
              );
            }
          );


        /* WEATHER */

        const weather =
          document.getElementById(
            "weather"
          );


        function clearWeather() {

          while (
            weather.firstChild
          ) {

            weather.removeChild(
              weather.firstChild
            );

          }

        }


        function createRain() {

          clearWeather();


          for (
            let i = 0;
            i < 120;
            i++
          ) {

            const drop =
              document.createElement(
                "a-box"
              );


            drop.setAttribute(
              "width",
              ".015"
            );

            drop.setAttribute(
              "height",
              ".35"
            );

            drop.setAttribute(
              "depth",
              ".015"
            );

            drop.setAttribute(
              "color",
              "#88bbff"
            );

            drop.setAttribute(
              "position",
              (
                Math.random() * 100 - 50
              ) +
              " " +
              (
                Math.random() * 25
              ) +
              " " +
              (
                Math.random() * 70 - 35
              )
            );

            drop.setAttribute(
              "weather-drop",
              "speed: 15"
            );

            weather.appendChild(
              drop
            );

          }

        }


        function createSnow() {

          clearWeather();


          for (
            let i = 0;
            i < 100;
            i++
          ) {

            const flake =
              document.createElement(
                "a-sphere"
              );


            flake.setAttribute(
              "radius",
              ".045"
            );

            flake.setAttribute(
              "color",
              "white"
            );

            flake.setAttribute(
              "position",
              (
                Math.random() * 100 - 50
              ) +
              " " +
              (
                Math.random() * 25
              ) +
              " " +
              (
                Math.random() * 70 - 35
              )
            );

            flake.setAttribute(
              "weather-drop",
              "speed: 3"
            );

            weather.appendChild(
              flake
            );

          }

        }


        document
          .getElementById(
            "normalButton"
          )
          .addEventListener(
            "click",
            clearWeather
          );


        document
          .getElementById(
            "rainButton"
          )
          .addEventListener(
            "click",
            createRain
          );


        document
          .getElementById(
            "snowButton"
          )
          .addEventListener(
            "click",
            createSnow
          );


        /* START KICK SYSTEM */

        setupKicking();


      }
    );

  }
);

</script>

</body>
</html>
